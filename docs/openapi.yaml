                  counts:
                    type: object
                    additionalProperties:
                      type: integer
        "401":
          description: Authentication required
        "403":
          description: analytics.read required
        "503":
          description: Diagnostics unavailable
      x-source: backend/internal/httpapi/analytics.go#analyticsMetrikaStatusHandler
      tags:
        - Administration
      security:
        - Session: []
      x-permissions:
