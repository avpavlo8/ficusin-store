      tags:
        - Storefront
      security: []
  /account/orders:
    get:
      operationId: accountOrders
      responses:
        "200":
          description: Current customer's latest orders
          content:
            application/json:
              schema:
                type: object
                required:
                  - orders
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/order.Summary"
        "401":
          $ref: "#/components/responses/ValidationError"
      x-source: backend/internal/httpapi/account.go#accountOrdersHandler
      tags:
        - Storefront
      security:
        - Session: []
  /account/orders/{orderNumber}:
    get:
      operationId: accountOrderDetail
      description: An order belonging to the authenticated customer. metrikaServer is true only if the
        server owns paid conversion delivery for this order. Browser converters must then skip it
        even if the current integration is disabled.
      parameters:
        - in: path
          name: orderNumber
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authenticated order detail
          content:
            application/json:
              schema:
                type: object
                required:
                  - order
                properties:
                  order:
                    $ref: "#/components/schemas/order.Detail"
        "401":
          description: Authentication required
        "404":
          description: Order not found
      x-source: backend/internal/httpapi/account.go#accountOrderHandler
      tags:
        - Storefront
      security:
        - Session: []
