openapi: 3.1.0
info:
  title: Ficusin Store API
  version: 1.2.0
  description: All registered API routes, including optional integrations. Detailed commerce contracts
    preserve existing RUB JSON amounts; arithmetic uses integer kopecks. Routes, references and
    security declarations are checked in CI. Some backoffice responses intentionally leave their
    payload schema unspecified; source handlers are linked by x-source.
servers:
  - url: /api/v1
paths:
  /account/avatar:
    delete:
      operationId: delete_account_avatar
      responses:
        2XX:
          description: Successful response. Payload and business rules are implemented by the source handler.
        default:
          $ref: "#/components/responses/ValidationError"
      x-source: backend/internal/httpapi/avatar.go#deleteAvatar
      tags:
        - Storefront
      security:
        - Session: []
    get:
      operationId: get_account_avatar
      responses:
        2XX:
          description: Successful response. Payload and business rules are implemented by the source handler.
        default:
          $ref: "#/components/responses/ValidationError"
