components:
  responses:
    ValidationError:
      description: Request cannot be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ChatMessageInput:
      type: object
      required:
        - clientId
      description: Text must be nonempty after trimming unless an attachment or legacy image is supplied.
        attachment and image are mutually exclusive. Context URLs must start with /product/, /care/
        or /account/orders/ and may not contain CR, LF or backslash.
      properties:
        clientId:
          type: string
          minLength: 16
          maxLength: 80
        text:
          type: string
          maxLength: 4000
        attachment:
          type: object
          required:
            - name
            - data
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 180
              description: Server strips directory components; NUL/CR/LF and empty names are rejected.
            data:
              type: string
              maxLength: 29360128
              description: Standard base64 without a data URL prefix. Decoded size must be 1 byte to 20 MiB.
                Content-sniffed JPEG/PNG must decode successfully and be at most 2 MiB and 16
                million pixels. Content-sniffed MP4/WebM are inline video; all other bytes are
                forced downloads.
        image:
          type: string
          deprecated: true
          description: Legacy JPEG/PNG data URL; decoded size at most 2 MiB and 16 million pixels. Cannot be
            combined with attachment.
        consent:
          type: boolean
          description: Required to be true only for a guest's first message.
        contextUrl:
          type: string
          maxLength: 500
          description: Maximum 500 UTF-8 bytes.
        contextLabel:
          type: string
          maxLength: 180
    ChatMessage:
      type: object
      required:
        - id
        - sender
        - text
        - hasImage
        - createdAt
      properties:
        id:
          type: integer
        sender:
