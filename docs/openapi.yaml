openapi: 3.1.0
info:
  title: Ficusin Store API
  version: 1.1.0
  description: Core typed contract. The exhaustive route and ownership inventory is maintained in docs/api-inventory.md.
servers:
  - url: /api/v1
paths:
  /admin/analytics/metrika:
    get:
      operationId: metrikaDeliveryStatus
      description: Requires analytics.read. Counts by durable delivery status; credentials and customer identifiers are never exposed.
      responses:
        "200":
          description: Server payment delivery status
          content:
            application/json:
              schema:
                type: object
                required: [enabled, counts]
                properties:
                  enabled: {type: boolean}
                  counts:
                    type: object
                    additionalProperties: {type: integer}
        "401": {description: Authentication required}
        "403": {description: analytics.read required}
        "503": {description: Diagnostics unavailable}
  /account/orders/{orderNumber}:
    get:
      operationId: accountOrderDetail
      description: An order belonging to the authenticated customer. metrikaServer is true only if the server owns paid conversion delivery for this order. Browser converters must then skip it even if the current integration is disabled.
      parameters:
        - in: path
          name: orderNumber
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Authenticated order detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    type: object
                    properties:
                      metrikaServer: {type: boolean}
        "401": {description: Authentication required}
        "404": {description: Order not found}
  /chat/notifications:
    post:
      operationId: subscribeChatPush
      description: Opt-in browser subscription for the current customer or guest. Requires configured VAPID. Text previews are delivered through the durable chat queue.
      requestBody: &chatPushBody
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: {type: string, format: uri}
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: {type: string}
                    auth: {type: string}
      responses:
        "200": {description: Browser opted in}
        "400": {description: Invalid subscription}
        "503": {description: Push is not configured}
    delete:
      operationId: unsubscribeChatPush
      requestBody: *chatPushBody
      responses:
        "200": {description: Current recipient's chat subscription disabled; order subscriptions unchanged}
  /chat/notifications/state:
    post:
      operationId: chatPushState
      requestBody: *chatPushBody
      responses:
        "200":
          description: Whether the supplied endpoint is subscribed for the current recipient
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: {type: boolean}
  /admin/chat/notifications:
    post:
      operationId: subscribeStaffChatPush
      description: Requires chat.manage; permissions are rechecked at delivery.
      requestBody: *chatPushBody
      responses:
        "200": {description: Staff browser subscribed}
        "401": {description: Authentication required}
        "403": {description: chat.manage required}
    delete:
      operationId: unsubscribeStaffChatPush
      requestBody: *chatPushBody
      responses:
        "200": {description: Staff browser unsubscribed from chat only}
  /admin/chat/notifications/state:
    post:
      operationId: staffChatPushState
      requestBody: *chatPushBody
      responses:
        "200": {description: Returns subscribed boolean for the current authorized staff member and browser}
  /chat:
    get:
      operationId: readMyChat
      description: Private guest/account human support thread. HttpOnly capability cookie for guests; customer history is bound on login. consentRequired is true only for a guest without a thread. Responses are no-store.
      parameters:
        - in: query
          name: before
          schema: {type: integer, minimum: 0}
        - in: query
          name: after
          description: Fetch messages newer than this ID, up to 50 per page. Takes precedence over before when positive.
          schema: {type: integer, minimum: 0}
      responses:
        "200":
          description: Thread with messages, read cursors and hasMore
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatThread"}
        "503": {description: Storage unavailable}
  /chat/messages:
    post:
      operationId: sendMyChatMessage
      description: Send text and/or one private attachment. A guest's first message requires consent; signed-in customers rely on registration consent without a new support_consents record. clientId deduplicates retries. JSON body is limited to 29 MiB. Customer limits per IP per application instance are 30 message attempts and 10 attachment attempts per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: Saved thread including the message
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatThread"}
        "400": {description: Invalid message or missing first-message guest consent}
        "429": {description: Send rate exceeded}
        "503": {description: Storage unavailable}
  /chat/unread:
    get:
      operationId: myChatUnread
      responses:
        "200": {description: Number of unread staff messages}
  /chat/read:
    post:
      operationId: markMyChatRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [through]
              properties:
                through: {type: integer, minimum: 0}
      responses:
        "200": {description: Visible messages marked read}
  /chat/photos/{messageID}:
    get:
      operationId: myChatPhoto
      description: Backward-compatible private JPEG/PNG route. Same access and response security headers as the attachment route; non-image attachments return 404.
      parameters:
        - in: path
          name: messageID
          required: true
          schema: {type: integer}
      responses:
        "200": {description: Private JPEG or PNG, no-store}
        "404": {description: Photo unavailable to this participant}
  /chat/attachments/{messageID}:
    get:
      operationId: myChatAttachment
      description: Private attachment requiring access to the current guest/account thread. Validated JPEG/PNG and content-sniffed MP4/WebM are inline; all other files are forced application/octet-stream downloads. Responses use no-store, nosniff and CSP default-src 'none'; sandbox. Byte ranges are served by http.ServeContent.
      parameters:
        - in: path
          name: messageID
          required: true
          schema: {type: integer}
        - in: header
          name: Range
          schema: {type: string}
      responses:
        "200": {description: Private attachment bytes}
        "206": {description: Requested byte range}
        "404": {description: Attachment unavailable to this participant}
        "416": {description: Unsatisfiable byte range}
  /admin/chat:
    get:
      operationId: supportInbox
      description: Requires chat.manage. Filter by status, search q, paginate with offset; see docs/site-chat.md.
      responses:
        "200": {description: Inbox items and hasMore}
        "401": {description: Sign in required}
        "403": {description: chat.manage required}
  /admin/chat/{id}/messages:
    post:
      operationId: sendSupportChatMessage
      description: Staff reply with text and/or one attachment. Requires chat.manage. Same attachment and JSON size limits as customer messages; no consent checkbox is required.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatMessageInput"}
      responses:
        "200":
          description: Saved thread including the reply
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatThread"}
        "400": {description: Invalid message}
        "401": {description: Sign in required}
        "403": {description: chat.manage required}
        "404": {description: Thread not found}
        "503": {description: Storage unavailable}
  /admin/chat/{id}/attachments/{messageID}:
    get:
      operationId: supportChatAttachment
      description: Requires chat.manage. Same private content handling, Range support and security headers as the customer attachment route; the message must belong to this thread.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
        - in: path
          name: messageID
          required: true
          schema: {type: integer}
        - in: header
          name: Range
          schema: {type: string}
      responses:
        "200": {description: Private attachment bytes}
        "206": {description: Requested byte range}
        "401": {description: Sign in required}
        "403": {description: chat.manage required}
        "404": {description: Attachment not found in this thread}
        "416": {description: Unsatisfiable byte range}
  /admin/chat/{id}/photos/{messageID}:
    get:
      operationId: supportChatPhoto
      description: Backward-compatible private JPEG/PNG route requiring chat.manage. Same response security headers as attachments; non-image attachments return 404.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer}
        - in: path
          name: messageID
          required: true
          schema: {type: integer}
      responses:
        "200": {description: Private JPEG or PNG, no-store}
        "401": {description: Sign in required}
        "403": {description: chat.manage required}
        "404": {description: Photo not found in this thread}
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: API is ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
                  version:
                    type: string
  /ready:
    get:
      operationId: readiness
      responses:
        "200":
          description: API and PostgreSQL are ready to serve traffic
        "503":
          description: A required dependency is unavailable
  /catalog:
    get:
      operationId: listCatalog
      responses:
        "200":
          description: Available products
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
  /products/{code}:
    get:
      operationId: productDetail
      parameters:
        - in: path
          name: code
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Product with stable attribute values and localized display values
          content:
            application/json:
              schema:
                type: object
                required: [product]
                properties:
                  product:
                    $ref: "#/components/schemas/ProductDetail"
  /auth/request-code:
    post:
      operationId: requestCallVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, flow]
              properties:
                phone: {type: string}
                flow: {type: string, enum: [login, register]}
      responses:
        "200":
          description: Phone number to call and opaque verification ID. Sets a five-minute HttpOnly browser challenge cookie; retain it for verification.
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/ValidationError"
  /auth/verify-code:
    post:
      operationId: verifyCall
      description: Requires the ficusin_call_challenge cookie issued to the same browser by request-code. Pending polling retains it; successful verification consumes the check and clears the cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallVerification"
      responses:
        "200":
          description: Session created
        "202":
          description: Call confirmation is still pending
        "401":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ValidationError"
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: Session deleted
  /auth/me:
    get:
      operationId: currentUser
      responses:
        "200":
          description: Current customer
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/ValidationError"
  /account/orders:
    get:
      operationId: accountOrders
      responses:
        "200":
          description: Current customer's latest orders
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderSummary"
        "401":
          $ref: "#/components/responses/ValidationError"
  /cart:
    get:
      operationId: getCart
      responses:
        "200":
          description: Server cart with self-contained exact-SKU display lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    put:
      operationId: replaceCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: object
                  additionalProperties: {type: integer, minimum: 1, maximum: 20}
      responses:
        "200":
          description: Saved server cart and resolved display lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
  /delivery/cdek:
    get:
      operationId: cdekLocations
      parameters:
        - in: query
          name: action
          required: true
          schema:
            type: string
            enum: [cities, offices]
        - in: query
          name: city
          schema:
            type: string
        - in: query
          name: cityCode
          schema:
            type: integer
      responses:
        "200":
          description: Matching CDEK locations
    post:
      operationId: cdekQuote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cityCode, items]
              properties:
                cityCode:
                  type: integer
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/OrderItemInput"
      responses:
        "200":
          description: Delivery quote
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attribution:
                  type: object
                  properties:
                    analyticsAllowed: {type: boolean}
                    metrikaClientId:
                      type: string
                      pattern: '^[0-9]{1,20}$'
                      description: Actual Yandex visit client ID; omitted when analytics are disabled or no counter cookie exists. Server ownership is determined by the backend.
      responses:
        "201":
          description: Order saved. New guests also receive guestPaymentToken for payment only; it must not be stored in localStorage or analytics.
        "400":
          $ref: "#/components/responses/ValidationError"
  /payments/orders/{orderNumber}:
    post:
      operationId: startOwnedOrderPayment
      description: Requires the order owner's session or the guest token issued at checkout. Guest tokens stop working after phone-based account linking. Rate limited by IP and, after authorization, by order.
      parameters:
        - {in: path, name: orderNumber, required: true, schema: {type: string}}
        - {in: header, name: X-Order-Payment-Token, required: false, schema: {type: string, minLength: 64, maxLength: 64}}
      responses:
        "200": {description: Existing or new confirmationUrl and public payment balance}
        "404": {description: Order absent or access denied, with the same response}
        "409": {description: Payment cannot currently be opened}
        "429": {description: Too many attempts}
  /admin/orders/{id}/refund:
    post:
      operationId: refundOrderAmount
      description: Requires payments.refund (owner). Persists all split attempts before sending. A pending refund is not a successful refund; read the adjustment balance for history and fiscal tasks.
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason, requestId]
              properties:
                amount: {type: number, exclusiveMinimum: 0}
                reason: {type: string}
                requestId: {type: string, minLength: 16, maxLength: 128}
      responses:
        "200": {description: Current balance and refund history; pending may remain}
        "400": {description: Invalid amount, provider rejection or fiscal composition requires review}
        "403": {description: payments.refund required}
  /admin/orders/{id}/refunds/{refundID}/receipt:
    post:
      operationId: confirmRefundTillReceipt
      description: Requires payments.refund. Records confirmation that the shop till has already issued a receipt; does not issue or sign any document.
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer}}
        - {in: path, name: refundID, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: {const: true}
      responses:
        "200": {description: Confirmation and actor saved}
        "403": {description: payments.refund required}
        "409": {description: No outstanding fiscal task for this order and refund}
  /admin/orders/{id}/refunds/{refundID}/resolve:
    post:
      operationId: resolveUnknownRefund
      description: Requires payments.refund. Fetches the supplied refund ID from YooKassa and verifies its payment and amount. Never creates another provider refund.
      parameters:
        - {in: path, name: id, required: true, schema: {type: integer}}
        - {in: path, name: refundID, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId]
              properties:
                providerId: {type: string}
      responses:
        "200": {description: Verified provider ID attached and balance reconciled}
        "403": {description: payments.refund required}
        "409": {description: Refund does not match the saved attempt}
  /admin/dashboard:
    get:
      operationId: adminDashboard
      description: Requires an authenticated customer with an active role in admin_users.
      responses:
        "200":
          description: Store totals, latest orders and latest synchronization runs
        "401":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ValidationError"
  /integrations/saby/catalog:
    post:
      operationId: synchronizeSabyCatalog
      description: >
        Replaces current Saby prices, balances and product media. The request
        must carry a GitHub Actions OIDC token issued for the repository,
        main branch and the Saby workflow.
      parameters:
        - in: header
          name: X-Ficusin-GitHub-OIDC
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 2000
                  items:
                    $ref: "#/components/schemas/SabyCatalogItem"
      responses:
        "200":
          description: Catalog synchronized
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ValidationError"
components:
  responses:
    ValidationError:
      description: Request cannot be completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ChatMessageInput:
      type: object
      required: [clientId]
      description: Text must be nonempty after trimming unless an attachment or legacy image is supplied. attachment and image are mutually exclusive. Context URLs must start with /product/, /care/ or /account/orders/ and may not contain CR, LF or backslash.
      properties:
        clientId: {type: string, minLength: 16, maxLength: 80}
        text: {type: string, maxLength: 4000}
        attachment:
          type: object
          required: [name, data]
          properties:
            name: {type: string, minLength: 1, maxLength: 180, description: Server strips directory components; NUL/CR/LF and empty names are rejected.}
            data: {type: string, maxLength: 29360128, description: Standard base64 without a data URL prefix. Decoded size must be 1 byte to 20 MiB. Content-sniffed JPEG/PNG must decode successfully and be at most 2 MiB and 16 million pixels. Content-sniffed MP4/WebM are inline video; all other bytes are forced downloads.}
        image: {type: string, deprecated: true, description: Legacy JPEG/PNG data URL; decoded size at most 2 MiB and 16 million pixels. Cannot be combined with attachment.}
        consent: {type: boolean, description: Required to be true only for a guest's first message.}
        contextUrl: {type: string, maxLength: 500, description: Maximum 500 UTF-8 bytes.}
        contextLabel: {type: string, maxLength: 180}
    ChatMessage:
      type: object
      required: [id, sender, text, hasImage, createdAt]
      properties:
        id: {type: integer}
        sender: {type: string, enum: [customer, staff]}
        text: {type: string}
        contextUrl: {type: string}
        contextLabel: {type: string}
        hasImage: {type: boolean, description: True for JPEG/PNG including legacy photo messages.}
        attachmentName: {type: string}
        attachmentKind: {type: string, enum: [image, video, file]}
        attachmentSize: {type: integer, minimum: 1, description: Stored attachment size in bytes; also provided for legacy photos when nonzero.}
        createdAt: {type: string, format: date-time}
    ChatThread:
      type: object
      required: [id, status, customerReadId, staffReadId, messages, hasMore, consentRequired]
      properties:
        id: {type: integer, description: Zero before the first message.}
        status: {type: string, enum: [open, closed]}
        customerReadId: {type: integer}
        staffReadId: {type: integer}
        messages:
          type: array
          items: {$ref: "#/components/schemas/ChatMessage"}
        hasMore: {type: boolean}
        consentRequired: {type: boolean, description: True only when a guest without an existing thread must consent before sending. False for signed-in customers and staff.}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Product:
      type: object
      required: [id, name, latin, category, price, image, light, size, stock]
      properties:
        id:
          type: string
        name:
          type: string
        latin:
          type: string
        category:
          type: string
        price:
          type: number
        image:
          type: string
        light:
          type: string
        size:
          type: string
        stock:
          type: integer
        heightCm:
          type: number
          description: Confirmed positive height of the default variant displayed in the catalog; omitted when unknown.
        filterAttributes:
          type: array
          items:
            $ref: "#/components/schemas/ProductAttribute"
    ProductDetail:
      type: object
      required: [id, name, images, variants, attributes]
      properties:
        id: {type: string}
        name: {type: string}
        images:
          type: array
          items: {type: string}
        variants:
          type: array
          items:
            type: object
            properties:
              attributes:
                type: array
                items:
                  $ref: "#/components/schemas/ProductAttribute"
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/ProductAttribute"
    ProductAttribute:
      type: object
      required: [code, name, value, displayValue, badge, filterable, showInCharacteristics]
      description: >-
        value is the stable technical value. displayValue comes from
        attribute_options; unknown codes fall back to the unchanged value.
      properties:
        code: {type: string}
        name: {type: string}
        unit: {type: string}
        value: {}
        displayValue: {}
        options:
          type: array
          items: {type: string}
        optionLabels:
          type: object
          additionalProperties: {type: string}
        badge: {type: boolean}
        filterable: {type: boolean}
        summaryPosition: {type: integer}
        showInCharacteristics: {type: boolean}
    CallVerification:
      type: object
      required: [phone, flow, checkId]
      properties:
        checkId: {type: string}
        flow: {type: string, enum: [login, register]}
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        accountType:
          type: string
          enum: [retail, wholesale]
        companyName:
          type: string
        inn:
          type: string
        kpp:
          type: string
        legalAddress:
          type: string
        consent:
          type: boolean
    OrderItemInput:
      type: object
      required: [id, quantity]
      properties:
        id: {type: string, description: Exact Ficusin SKU}
        quantity: {type: integer, minimum: 1, maximum: 20}
    CartProduct:
      type: object
      required: [id, sku, name, variantLabel, price, image, stock, available]
      properties:
        id: {type: string}
        sku: {type: string}
        name: {type: string}
        variantLabel: {type: string}
        price: {type: number}
        image: {type: string}
        stock: {type: integer}
        available: {type: boolean}
    Cart:
      type: object
      required: [items, lines, missingSkus]
      properties:
        items:
          type: object
          additionalProperties: {type: integer}
        lines:
          type: array
          items: {$ref: "#/components/schemas/CartProduct"}
        missingSkus:
          type: array
          items: {type: string}
    User:
      type: object
      required:
        [id, email, phone, fullName, accountType, wholesaleStatus, retailDiscountBps,
         lifetimeSpendMinor]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        phone:
          type: string
        fullName:
          type: string
        accountType:
          type: string
          enum: [retail, wholesale]
        wholesaleStatus:
          type: string
        retailDiscountBps:
          type: integer
        lifetimeSpendMinor:
          type: integer
          format: int64
          description: >-
            Сумма выполненных заказов в копейках. Кабинет считает по ней,
            сколько осталось до следующей ступени скидки.
    OrderSummary:
