stages:
  - verify

frontend:
  image: node:24-bookworm-slim
  stage: verify
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit
  script:
    - npm run lint
    - npm run build

backend:
  image: golang:1.26-bookworm
  stage: verify
  cache:
    key:
      files:
        - backend/go.sum
    paths:
      - .go/
  variables:
    GOCACHE: "$CI_PROJECT_DIR/.go/build"
    GOPATH: "$CI_PROJECT_DIR/.go/path"
  before_script:
    - cd backend
    - go mod download
  script:
    - go test ./...
    - go vet ./...
    - go build ./cmd/api
