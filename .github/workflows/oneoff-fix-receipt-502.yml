name: Apply receipt prepare 502 fix
on:
  push:
    branches:
      - fix/procurement-receipt-502
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/procurement-receipt-502
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Apply patch
        run: python3 scripts/oneoff_fix_receipt_prepare_502.py
      - name: Format
        run: gofmt -w backend/internal/procurement/service.go backend/internal/procurement/service_prepare_receipt_fallback_test.go
      - name: Test procurement
        working-directory: backend
        run: go test ./internal/procurement
      - name: Commit fix
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add backend/internal/procurement/service.go backend/internal/procurement/service_prepare_receipt_fallback_test.go
          git commit -m "fix(procurement): avoid Saby refresh gateway timeout"
          git push origin HEAD:fix/procurement-receipt-502
