name: Catalogue model rewrite helper

on:
  push:
    branches: [feature/catalog-attribute-system-v2]
    paths:
      - scripts/catalog_model_rewrite.py
      - scripts/catalog_pim_followup.py
      - .github/workflows/catalog-model-rewrite.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/catalog-attribute-system-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply one-shot catalogue patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/catalog_model_rewrite.py')
          if path.exists():
              text = path.read_text(encoding='utf-8')
              text = text.replace('quantity: number }>;\n",', 'quantity: number }>;\\n",')
              path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/catalog_model_rewrite.py
          python3 scripts/catalog_pim_followup.py
      - name: Remove one-shot helpers
        run: rm -f scripts/catalog_model_rewrite.py scripts/catalog_pim_followup.py .github/workflows/catalog-model-rewrite.yml
      - run: git diff --check
      - name: Commit catalogue refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: finish catalogue v2 PIM model"
          git push origin HEAD:feature/catalog-attribute-system-v2
