name: Trim Saby sync feedback bundle
on:
  push:
    branches:
      - fix/saby-sync-feedback
jobs:
  trim:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saby-sync-feedback
      - name: Trim copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/AdminProcurement.tsx')
          s=p.read_text()
          replacements = {
            'Запрашиваем обновление каталога СБИС…': 'Запрашиваем СБИС…',
            'Запрос принят. Ждём, пока СБИС отдаст каталог…': 'СБИС: запрос принят…',
            'СБИС: обновление стоит в очереди…': 'СБИС: в очереди…',
            'СБИС: загружаем каталог…': 'СБИС: загрузка…',
            'СБИС: обновление не завершилось за 2 минуты. Откройте «Интеграции» — там будет видна причина или состояние очереди.': 'СБИС: синхронизация дольше 2 минут. Статус — в «Интеграциях».',
            'СБИС: обновление не завершилось за 2 минуты. Проверьте статус в «Интеграциях».': 'СБИС: синхронизация дольше 2 минут. Статус — в «Интеграциях».',
            'Каталог СБИС обновлён: ${state.rowsSynced} позиций. Данные на странице перечитаны.': 'СБИС обновлён: ${state.rowsSynced} позиций.',
          }
          for old, new in replacements.items():
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm run budget
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add frontend/src/AdminProcurement.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): keep Saby sync feedback within budget"
          git push origin HEAD:fix/saby-sync-feedback
