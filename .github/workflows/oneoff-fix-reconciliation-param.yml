name: Fix reconciliation parameter typing
on:
  push:
    branches: [fix/procurement-reconciliation-workflow]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ficusin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d ficusin_test"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ficusin_test?sslmode=disable
      CRM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ficusin_test?sslmode=disable
      DATABASE_SSL_VERIFY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/procurement-reconciliation-workflow
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - name: Patch
        run: |
          python3 scripts/oneoff_fix_reconciliation_param.py
          gofmt -w backend/internal/procurement/postgres.go
      - name: Apply migrations
        run: |
          for file in $(find timeweb/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$file" >/dev/null
          done
      - name: Stage 06 regression
        working-directory: backend
        run: go test ./internal/procurement -run TestStage06 -count=1
      - name: Manual reconciliation regressions
        working-directory: backend
        run: go test ./internal/procurement -run 'Test(ResolveAliasCollapsesLateInvoiceLineOnLiveDatabase|ManualInvoicePairOverridesWrongAliasAndPreservesPlanPrice)$' -count=1
      - name: Regular backend
        working-directory: backend
        run: |
          env -u CRM_TEST_DATABASE_URL go test ./...
          go vet ./...
          go build ./cmd/api
      - name: Commit
        run: |
          rm -f scripts/oneoff_fix_reconciliation_param.py .github/workflows/oneoff-fix-reconciliation-param.yml
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "fix(procurement): type invoice price in reconciliation"
          git push origin HEAD:fix/procurement-reconciliation-workflow
