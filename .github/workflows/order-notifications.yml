name: Send new orders to Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/order-notifications.yml"

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: ficusin-order-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ORDER_CHAT_ID: "-5430918511"
      FICUSIN_ORDER_NOTIFICATIONS_URL: "https://ryazan-plants.avpavlomail.chatgpt.site/api/integrations/orders/notifications"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Deliver pending orders
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def request_json(request):
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def report(context, state):
              request = urllib.request.Request(
                  "https://api.github.com/repos/"
                  + os.environ["GITHUB_REPOSITORY"]
                  + "/statuses/"
                  + os.environ["GITHUB_SHA"],
                  data=json.dumps({
                      "state": state,
                      "description": (
                          "Order notifications delivered"
                          if state == "success"
                          else "Order notification delivery failed"
                      ),
                      "context": context[:100],
                  }).encode("utf-8"),
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30):
                  pass

          def store_request(token, payload):
              return request_json(urllib.request.Request(
                  os.environ["FICUSIN_ORDER_NOTIFICATIONS_URL"],
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={
                      "X-Ficusin-GitHub-OIDC": token,
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "Ficusin-Order-Notifications/1.0",
                  },
                  method="POST",
              ))

          def money(value):
              return f"{float(value):,.0f}".replace(",", " ") + " ₽"

          try:
              bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
              if not bot_token:
                  report("orders/telegram/secret-missing", "failure")
                  raise SystemExit("Telegram bot secret is not configured")

              oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              separator = "&" if "?" in oidc_url else "?"
              oidc_request = urllib.request.Request(
                  oidc_url + separator + urllib.parse.urlencode({
                      "audience": "ficusin-store-order-notifications",
                  }),
                  headers={
                      "Authorization":
                          "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
                  },
              )
              oidc_token = request_json(oidc_request).get("value")
              if not oidc_token:
                  raise RuntimeError("OIDC token is missing")

              pending = store_request(oidc_token, {"action": "list"})
              orders = pending.get("orders") or []
              if not orders:
                  report("orders/telegram/queue-empty", "success")
                  print("No pending orders")
                  raise SystemExit(0)

              delivery_labels = {
                  "pickup": "Самовывоз в Рязани",
                  "courier": "Курьер по Рязани",
                  "cdek": "СДЭК по России",
                  "post": "Почта России",
              }
              sent = 0
              for order in orders:
                  item_lines = []
                  item_length = 0
                  for item in order.get("items") or []:
                      line = (
                          "• "
                          + html.escape(str(item.get("name") or "Товар"))
                          + " × "
                          + str(item.get("quantity") or 0)
                          + " — "
                          + html.escape(
                              money(
                                  float(item.get("price") or 0)
                                  * int(item.get("quantity") or 0)
                              )
                          )
                      )
                      if item_length + len(line) > 2600:
                          item_lines.append("• …остальные позиции есть в заказе на сайте")
                          break
                      item_lines.append(line)
                      item_length += len(line)

                  delivery = delivery_labels.get(
                      order.get("deliveryMethod"),
                      str(order.get("deliveryMethod") or "Не указано"),
                  )
                  lines = [
                      "🌿 <b>Новый заказ "
                      + html.escape(str(order.get("orderNumber") or ""))
                      + "</b>",
                      "",
                      *item_lines,
                      "",
                      "<b>Товары:</b> " + html.escape(money(order.get("subtotal") or 0)),
                      "<b>Доставка:</b> " + html.escape(money(order.get("deliveryFee") or 0)),
                      "<b>Итого:</b> " + html.escape(money(order.get("total") or 0)),
                      "<b>Получение:</b> " + html.escape(delivery),
                  ]
                  if order.get("address"):
                      lines.append("<b>Адрес:</b> " + html.escape(str(order["address"])))
                  lines.extend([
                      "",
                      "<b>Покупатель:</b> " + html.escape(str(order.get("customerName") or "")),
                      "<b>Телефон:</b> " + html.escape(str(order.get("phone") or "")),
                      "<b>Email:</b> " + html.escape(str(order.get("email") or "")),
                  ])
                  if order.get("comment"):
                      lines.append(
                          "<b>Комментарий:</b> "
                          + html.escape(str(order["comment"]))[:500]
                      )

                  telegram_request = urllib.request.Request(
                      "https://api.telegram.org/bot"
                      + bot_token
                      + "/sendMessage",
                      data=json.dumps({
                          "chat_id": os.environ["TELEGRAM_ORDER_CHAT_ID"],
                          "text": "\n".join(lines),
                          "parse_mode": "HTML",
                          "disable_web_page_preview": True,
                      }, ensure_ascii=False).encode("utf-8"),
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "Ficusin-Order-Notifications/1.0",
                      },
                      method="POST",
                  )
                  response = request_json(telegram_request)
                  if not response.get("ok"):
                      raise RuntimeError("Telegram rejected a notification")

                  store_request(oidc_token, {
                      "action": "ack",
                      "orderNumbers": [order["orderNumber"]],
                  })
                  sent += 1

              report(f"orders/telegram/sent-{sent}", "success")
              print(f"Delivered {sent} order notifications")
          except urllib.error.HTTPError as error:
              report(f"orders/telegram/http-{error.code}", "failure")
              raise SystemExit("Order notification request failed") from None
          except SystemExit:
              raise
          except Exception:
              report("orders/telegram/error", "failure")
              raise SystemExit("Order notification delivery failed") from None
          PY
