name: CRM acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crm-live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ficusin_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s
          --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ficusin_crm_test?sslmode=disable
      DATABASE_SSL_VERIFY: 'false'
      AUTH_COOKIE_SECURE: 'false'
      TELEGRAM_BOT_TOKEN: ci-dummy-token
      TELEGRAM_ORDER_CHAT_ID: '-100000000001'
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: npm ci && npm run build
        working-directory: frontend
      - run: go build -o ../crm-api ./cmd/api
        working-directory: backend
      - name: Start isolated app without external credentials
        run: |
          STATIC_DIR="$PWD/frontend/dist" MIGRATIONS_DIR="$PWD/timeweb/migrations" ./crm-api > crm-api.log 2>&1 &
          app_pid=$!
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/v1/ready; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat crm-api.log
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/v1/ready
          psql -h 127.0.0.1 -U postgres -d ficusin_crm_test -v ON_ERROR_STOP=1 -f scripts/seed-crm-acceptance.sql
      - name: Verify durable synchronization coordination
        env:
          CRM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ficusin_crm_test?sslmode=disable
        run: go test ./internal/procurement -run TestIntegrationCoordinatorLive -count=1
        working-directory: backend
      - name: Verify real API and desktop/mobile UI
        run: >-
          docker run --rm --network host --ipc=host
          -v "$GITHUB_WORKSPACE:/work" -w /work/e2e
          -e GITHUB_SHA -e CRM_ARTIFACT_DIR=/work/crm-artifacts
          mcr.microsoft.com/playwright:v1.63.0-noble
          bash -c 'npm ci && node verify-crm-acceptance.mjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-stage-02-acceptance
          path: |
            crm-artifacts/
            crm-api.log
