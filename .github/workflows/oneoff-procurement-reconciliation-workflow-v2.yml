name: Apply procurement reconciliation workflow v2
on:
  push:
    branches: [fix/procurement-reconciliation-workflow]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ficusin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d ficusin_test"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ficusin_test?sslmode=disable
      CRM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ficusin_test?sslmode=disable
      DATABASE_SSL_VERIFY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/procurement-reconciliation-workflow
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply patch
        run: |
          python3 scripts/fix_oneoff_procurement_reconciliation_script.py
          python3 scripts/oneoff_procurement_reconciliation_workflow.py
          gofmt -w backend/internal/procurement/model.go backend/internal/procurement/service.go backend/internal/procurement/postgres.go backend/internal/procurement/postgres_catalogue.go backend/internal/procurement/late_alias_reconciliation_live_test.go
      - name: Apply migrations
        run: |
          for file in $(find timeweb/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$file" >/dev/null
          done
      - name: Targeted live regression
        working-directory: backend
        run: go test ./internal/procurement -run 'Test(ResolveAliasCollapsesLateInvoiceLineOnLiveDatabase|ManualInvoicePairOverridesWrongAliasAndPreservesPlanPrice)$' -count=1
      - name: Backend regular tests
        working-directory: backend
        run: env -u CRM_TEST_DATABASE_URL go test ./...
      - name: Vet and build backend
        working-directory: backend
        run: |
          go vet ./...
          go build ./cmd/api
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit fix
        run: |
          rm -f scripts/oneoff_procurement_reconciliation_workflow.py scripts/fix_oneoff_procurement_reconciliation_script.py
          rm -f .github/workflows/oneoff-procurement-reconciliation-workflow.yml .github/workflows/oneoff-procurement-reconciliation-workflow-v2.yml
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(procurement): make invoice reconciliation buyer-driven"
            git push origin HEAD:fix/procurement-reconciliation-workflow
          fi
