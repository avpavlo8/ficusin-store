name: Saby probe

# Только вручную. Разведка нужна раз в жизни вопроса, расписание ей ни к чему.
on:
  workflow_dispatch:
    inputs:
      search:
        description: Название товара для поиска (например, Араукария)
        required: false
        default: Араукария
  # Одноразовая проверка ветки интеграции. В main этого триггера не будет.
  push:
    branches:
      - codex/saby-pricechange-api

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Saby nomenclature
        env:
          SABY_APP_CLIENT_ID: ${{ secrets.SABY_APP_CLIENT_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
          SABY_POINT_ID: ${{ vars.SABY_POINT_ID }}
          SABY_PROBE_SEARCH: ${{ github.event_name == 'push' && '__pricechange_create__:38691' || inputs.search }}
        run: python3 scripts/saby-probe.py
