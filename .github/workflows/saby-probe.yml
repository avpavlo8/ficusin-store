name: Saby receipt link probe
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect receipt identifiers
        env:
          SABY_APP_CLIENT_ID: ${{ secrets.SABY_APP_CLIENT_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
          SABY_POINT_ID: ${{ vars.SABY_POINT_ID }}
        run: python3 scripts/saby-probe.py

      - uses: actions/upload-artifact@v4
        with:
          name: saby-serializer-modules
          path: /tmp/saby-modules
          retention-days: 1
