name: Saby probe

# Только вручную. Разведка нужна раз в жизни вопроса, расписание ей ни к чему.
on:
  workflow_dispatch:
    inputs:
      search:
        description: Название товара для поиска (например, Араукария)
        required: false
        default: Араукария
  # Одноразовая проверка при открытии PR. В main этого триггера не будет.
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Saby nomenclature
        env:
          SABY_APP_CLIENT_ID: ${{ secrets.SABY_APP_CLIENT_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
          SABY_POINT_ID: ${{ vars.SABY_POINT_ID }}
          SABY_PROBE_SEARCH: ${{ github.event_name == 'pull_request' && '__pricechange_create__:Араукария' || inputs.search }}
        run: python3 scripts/saby-probe.py
