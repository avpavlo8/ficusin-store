name: Approved production cutover preflight and backup
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only inventory or fresh tagged backup of fixed production database
        type: choice
        options: [inspect, backup, static-assets, receipts, seven-prepare, seven-create, cashier-audit, native-reserve-read, native-reserve-cycle, native-invoice-prepare, native-invoice-fill, native-invoice-edit, native-go-verify, cashier-inspect, cashier-backup, cashier-staging-deploy, cashier-staging-restore, cashier-production-activate, cashier-production-restart, cashier-production-verify]
        required: true
      expected_commit:
        description: Exact currently deployed main commit
        type: string
        required: true
permissions:
  contents: read
jobs:
  release:
    if: inputs.operation == 'inspect' || inputs.operation == 'backup'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install 'psycopg[binary]==3.2.13'
      - name: Read-only SQL and storage guard tests
        run: python3 -m unittest discover -s scripts -p 'test_production_legacy_inventory.py'
      - name: Verify exact production and recovery points without writes
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python3 scripts/production-release-preflight.py --expected-commit "$EXPECTED_COMMIT"
      - name: Read all legacy data counts and verify private object bytes
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python3 scripts/production-legacy-data-inventory.py --expected-commit "$EXPECTED_COMMIT"
      - name: Create one fixed tagged fresh recovery point
        if: inputs.operation == 'backup'
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: python3 scripts/production-release-backup.py --apply
  static-assets:
    if: inputs.operation == 'static-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          path: release-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: python3 -m pip install 'boto3==1.40.74'
      - run: python3 -m unittest discover -s scripts -p 'test_production_static_assets.py'
      - name: Publish and verify exact deployed release without deleting old assets
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-source
        run: python3 scripts/production-static-assets.py --expected-commit "$EXPECTED_COMMIT" --apply
  receipts:
    if: inputs.operation == 'receipts'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install 'psycopg[binary]==3.2.13'
      - run: python3 -m unittest discover -s scripts -p 'test_production_receipt_audit.py'
      - name: Read production fiscal evidence and YooKassa receipts without writes
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python3 scripts/production-receipt-audit.py --expected-commit "$EXPECTED_COMMIT"
  seven-receipts:
    if: inputs.operation == 'seven-prepare' || inputs.operation == 'seven-create'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          path: release-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: release-source/backend/go.sum
      - name: Prepare exact seven historical settlements using canonical service
        if: inputs.operation == 'seven-prepare'
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-source
          APPROVED_SUPPORT_TICKET: "31489326"
        run: python3 scripts/production-seven-settlements.py --expected-commit "$EXPECTED_COMMIT"
      - name: Create the seven owner-approved receipts and verify registration
        if: inputs.operation == 'seven-create'
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-source
          APPROVED_SUPPORT_TICKET: "31489326"
        run: python3 scripts/production-seven-settlements.py --expected-commit "$EXPECTED_COMMIT" --apply

  cashier-audit:
    if: inputs.operation == 'cashier-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install 'psycopg[binary]==3.2.13'
      - name: Read existing cash orders without changing documents or stock
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python3 scripts/production-cashier-audit.py

  native-reserve-read:
    if: inputs.operation == 'native-reserve-read' || inputs.operation == 'native-reserve-cycle' || inputs.operation == 'native-invoice-prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect or cycle only the fixed synthetic reserve invoice
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          NATIVE_RESERVE_ACTION: ${{ inputs.operation == 'native-reserve-cycle' && 'cycle' || inputs.operation == 'native-invoice-prepare' && 'invoice-template' || 'read' }}
        run: python3 scripts/saby-reserve-readback.py
      - uses: actions/upload-artifact@v4
        if: always() && inputs.operation == 'native-reserve-cycle'
        with:
          name: owned-native-reserve-cycle-${{ github.run_id }}
          path: saby-owned-reserve-cycle.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && inputs.operation == 'native-invoice-prepare'
        with:
          name: owned-native-invoice-template-${{ github.run_id }}
          path: saby-owned-invoice-template.json
          if-no-files-found: ignore
          retention-days: 30

  native-invoice-fill:
    if: inputs.operation == 'native-invoice-fill'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fill only fixed synthetic invoice without posting or payment
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python3 scripts/saby-owned-invoice-fill.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-native-invoice-fill-${{ github.run_id }}
          path: saby-owned-invoice-fill.json
          if-no-files-found: ignore
          retention-days: 30

  native-invoice-edit:
    if: inputs.operation == 'native-invoice-edit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replace only own synthetic invoice row and verify changed native reserve
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python3 scripts/saby-owned-invoice-edit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-native-invoice-edit-${{ github.run_id }}
          path: saby-owned-invoice-edit.json
          if-no-files-found: ignore
          retention-days: 30

  native-go-verify:
    if: inputs.operation == 'native-go-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 46d95fb74c2e9c5c133b1dd700d40222f1bbed29
          path: release-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: release-source/backend/go.sum
      - name: Verify exact candidate native reserve adapter only on owned test SKU
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-source
        run: python3 scripts/saby-owned-reserve-go-verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-native-go-reserve-${{ github.run_id }}
          path: saby-owned-reserve-go-evidence.json
          if-no-files-found: ignore
          retention-days: 30

  cashier-release:
    if: startsWith(inputs.operation, 'cashier-') && inputs.operation != 'cashier-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fixed-cashier-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'psycopg[binary]==3.2.13'
      - run: python3 -m unittest discover -s scripts -p 'test_cashier_release.py'
      - name: Execute fixed owner-approved release operation
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CASHIER_RELEASE_OPERATION: ${{ inputs.operation }}
        run: python3 scripts/cashier-release.py
