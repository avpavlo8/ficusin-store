name: Read-only staging cutover preflight
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact deployed staging SHA
        type: string
        required: true
      expected_version:
        description: Optional exact built code version for health/readiness checks
        type: string
        required: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install 'psycopg[binary]==3.2.13'
      - run: python3 -m unittest discover -s scripts -p 'test_staging_legacy_preflight.py'
      - name: Inspect isolated staging without writes
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: python3 scripts/staging-legacy-preflight.py --expected-commit "$EXPECTED_COMMIT" --expected-version "$EXPECTED_VERSION"
