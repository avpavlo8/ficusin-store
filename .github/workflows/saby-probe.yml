name: Saby live receipt read verification

# Только вручную. Разведка нужна раз в жизни вопроса, расписание ей ни к чему.
on:
  push:
    branches: [codex/saby-live-receipt-20260830]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the created receipt back from Saby
        env:
          SABY_APP_CLIENT_ID: ${{ secrets.SABY_APP_CLIENT_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
          SABY_POINT_ID: ${{ vars.SABY_POINT_ID }}
        run: python3 scripts/saby-probe.py
