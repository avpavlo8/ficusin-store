name: Approved production cutover preflight and backup
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only inventory or fresh tagged backup of fixed production database
        type: choice
        options: [inspect, backup, static-assets, receipts]
        required: true
      expected_commit:
        description: Exact currently deployed main commit
        type: string
        required: true
permissions:
  contents: read
jobs:
  release:
    if: inputs.operation != 'static-assets' && inputs.operation != 'receipts'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install 'psycopg[binary]==3.2.13'
      - name: Read-only SQL and storage guard tests
        run: python3 -m unittest discover -s scripts -p 'test_production_legacy_inventory.py'
      - name: Verify exact production and recovery points without writes
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python3 scripts/production-release-preflight.py --expected-commit "$EXPECTED_COMMIT"
      - name: Read all legacy data counts and verify private object bytes
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python3 scripts/production-legacy-data-inventory.py --expected-commit "$EXPECTED_COMMIT"
      - name: Create one fixed tagged fresh recovery point
        if: inputs.operation == 'backup'
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: python3 scripts/production-release-backup.py --apply
  static-assets:
    if: inputs.operation == 'static-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          path: release-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - run: python3 -m pip install 'boto3==1.40.74'
      - run: python3 -m unittest discover -s scripts -p 'test_production_static_assets.py'
      - name: Publish and verify exact deployed release without deleting old assets
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-source
        run: python3 scripts/production-static-assets.py --expected-commit "$EXPECTED_COMMIT" --apply
  receipts:
    if: inputs.operation == 'receipts'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install 'psycopg[binary]==3.2.13'
      - run: python3 -m unittest discover -s scripts -p 'test_production_receipt_audit.py'
      - name: Read production fiscal evidence and YooKassa receipts without writes
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python3 scripts/production-receipt-audit.py --expected-commit "$EXPECTED_COMMIT"
