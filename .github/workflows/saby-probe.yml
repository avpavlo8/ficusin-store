name: Read-only legacy data inventory
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact current production main commit
        type: string
        required: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only database client
        run: python3 -m pip install 'psycopg[binary]==3.2.13'
      - name: Test bounded read-only inventory guards
        run: python3 -m unittest discover -s scripts -p 'test_production_legacy_inventory.py'
      - name: Read production legacy data counts without writes
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: python3 scripts/production-legacy-data-inventory.py --expected-commit "$EXPECTED_COMMIT"
