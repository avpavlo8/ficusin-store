name: Saby receipt contract probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download public Saby warehouse client module
        run: |
          python3 - <<'PY'
          import urllib.request
          url = "https://cdn.sbis.ru/static/resources/WHDCore/Document/dialog.min.js?x_module=4b7a60ece34e6b52c3a701ab0b5947fc"
          with urllib.request.urlopen(url, timeout=60) as response:
              content = response.read()
          open("/tmp/whd-dialog.min.js", "wb").write(content)
          print("Downloaded public WHDCore module:", len(content), "bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: whd-dialog-source
          path: /tmp/whd-dialog.min.js
          retention-days: 1
