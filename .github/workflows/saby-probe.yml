name: Saby probe

# Только вручную. Разведка нужна раз в жизни вопроса, расписание ей ни к чему.
on:
  workflow_dispatch:
    inputs:
      search:
        description: Название товара для поиска (например, Араукария)
        required: false
        default: Араукария
      receipt_id:
        description: Числовой ID существующего поступления (только чтение схемы)
        required: false
      receipt_guid:
        description: UUID существующего поступления (только чтение схемы)
        required: false
      order_preflight:
        description: Read-only delivery API preflight for disposable fixture X380416519
        type: boolean
        default: false
      fixture_create_cancel:
        description: Owner-authorized single unpaid create/cancel for disposable fixture X380416519 only
        type: boolean
        default: false
      fixture_nonfiscal_payment:
        description: Explicit simulated external 1 RUB payment with nonFiscal=true; requires fixture_create_cancel
        type: boolean
        default: false
      fixture_reconcile:
        description: Read-only state of the already-created fixture order 3376
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Saby nomenclature
        if: inputs.receipt_id == '' && !inputs.order_preflight && !inputs.fixture_create_cancel
        env:
          SABY_APP_CLIENT_ID: ${{ secrets.SABY_APP_CLIENT_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
          SABY_POINT_ID: ${{ vars.SABY_POINT_ID }}
          SABY_PROBE_SEARCH: ${{ inputs.search }}
        run: python3 scripts/saby-probe.py
      - name: Read-only order integration preflight
        if: inputs.order_preflight
        env:
          SABY_APP_CLIENT_ID: ${{ secrets.SABY_APP_CLIENT_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
          SABY_POINT_ID: ${{ vars.SABY_POINT_ID }}
          SABY_FIXTURE_RECONCILE: ${{ inputs.fixture_reconcile }}
        run: python3 scripts/saby-order-preflight.py
      - name: Single fixture order lifecycle with verified readback
        if: inputs.fixture_create_cancel
        env:
          SABY_APP_CLIENT_ID: ${{ secrets.SABY_APP_CLIENT_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
          SABY_POINT_ID: ${{ vars.SABY_POINT_ID }}
          SABY_FIXTURE_NONFISCAL_TEST: ${{ inputs.fixture_nonfiscal_payment }}
        run: python3 scripts/saby-order-fixture-probe.py
      - uses: actions/upload-artifact@v4
        if: always() && inputs.fixture_create_cancel
        with:
          name: fixture-order-result
          path: fixture-order-result.json
          retention-days: 7
      - name: Probe existing receipt response schema without values
        if: inputs.receipt_id != ''
        env:
          SABY_APP_CLIENT_ID: ${{ secrets.SABY_APP_CLIENT_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
          SABY_RECEIPT_ID: ${{ inputs.receipt_id }}
          SABY_RECEIPT_GUID: ${{ inputs.receipt_guid }}
        run: python3 scripts/saby-receipt-probe.py
