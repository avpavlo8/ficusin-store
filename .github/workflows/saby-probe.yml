name: Saby serializer source probe
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download Saby core runtime
        run: |
          mkdir -p /tmp/saby-core
          curl --fail --location --retry 2 'https://cdn.sbis.ru/static/resources/contents.min.js?x_module=26.4213-107.24' -o /tmp/saby-core/contents.min.js
          wc -c /tmp/saby-core/contents.min.js
      - uses: actions/upload-artifact@v4
        with:
          name: saby-core-runtime
          path: /tmp/saby-core
          retention-days: 1
