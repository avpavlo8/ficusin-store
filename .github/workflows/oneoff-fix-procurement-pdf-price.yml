name: Apply procurement PDF and price display fix
on:
  push:
    branches: [fix/procurement-pdf-and-price-display]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/procurement-pdf-and-price-display
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch and verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # PDF: validation/calculation explicitly allow ignored rows and skip them.
          # The receiving PDF must follow the same rule instead of failing on them.
          p = Path('backend/internal/procurement/receiving_pdf.go')
          s = p.read_text()
          old = '''\t\tif line.ReconciliationStatus == "added" && !line.ComparisonAccepted {\n\t\t\tcontinue\n\t\t}\n\t\tif line.MatchStatus != "confirmed" || line.InvoicedQuantity == nil || *line.InvoicedQuantity <= 0 || line.ProposedRetailRUB == nil || *line.ProposedRetailRUB <= 0 {\n\t\t\treturn nil, &UserFacingError{Message: "PDF приёмки доступен только после сопоставления и расчёта всех позиций"}\n\t\t}\n'''
          new = '''\t\tif line.ReconciliationStatus == "added" && !line.ComparisonAccepted {\n\t\t\tcontinue\n\t\t}\n\t\tif line.MatchStatus == "ignored" {\n\t\t\tcontinue\n\t\t}\n\t\tname := strings.TrimSpace(line.SabyName)\n\t\tif name == "" {\n\t\t\tname = strings.TrimSpace(line.RawName)\n\t\t}\n\t\tif line.MatchStatus != "confirmed" {\n\t\t\treturn nil, &UserFacingError{Message: fmt.Sprintf("Не сопоставлена позиция для PDF приёмки: %s", blankDash(name))}\n\t\t}\n\t\tif line.InvoicedQuantity == nil || *line.InvoicedQuantity <= 0 {\n\t\t\treturn nil, &UserFacingError{Message: fmt.Sprintf("Не указано количество для PDF приёмки: %s", blankDash(name))}\n\t\t}\n\t\tif line.ProposedRetailRUB == nil || *line.ProposedRetailRUB <= 0 {\n\t\t\treturn nil, &UserFacingError{Message: fmt.Sprintf("Не рассчитана розничная цена для PDF приёмки: %s", blankDash(name))}\n\t\t}\n'''
          if old not in s:
              raise SystemExit('receiving PDF marker not found')
          s = s.replace(old, new, 1)
          # Remove now-duplicate name initialization immediately below.
          duplicate = '''\t\tname := strings.TrimSpace(line.SabyName)\n\t\tif name == "" {\n\t\t\tname = strings.TrimSpace(line.RawName)\n\t\t}\n\t\trows = append(rows, receivingPDFRow{'''
          if duplicate not in s:
              raise SystemExit('receiving PDF duplicate marker not found')
          s = s.replace(duplicate, '''\t\trows = append(rows, receivingPDFRow{''', 1)
          p.write_text(s)

          # Regression: ignored rows are intentionally omitted from the receiving sheet.
          p = Path('backend/internal/procurement/receiving_pdf_test.go')
          s = p.read_text()
          old = '''\t\t{SabyName: "Pending", MatchStatus: "confirmed", ReconciliationStatus: "added", InvoicedQuantity: &qty, ProposedRetailRUB: &price},\n\t\t{SabyName: "Accepted", MatchStatus: "confirmed", ReconciliationStatus: "added", ComparisonAccepted: true, InvoicedQuantity: &qty, ProposedRetailRUB: &price},\n'''
          new = '''\t\t{SabyName: "Pending", MatchStatus: "confirmed", ReconciliationStatus: "added", InvoicedQuantity: &qty, ProposedRetailRUB: &price},\n\t\t{SabyName: "Ignored", MatchStatus: "ignored", ReconciliationStatus: "changed", ComparisonAccepted: true, InvoicedQuantity: &qty},\n\t\t{SabyName: "Accepted", MatchStatus: "confirmed", ReconciliationStatus: "added", ComparisonAccepted: true, InvoicedQuantity: &qty, ProposedRetailRUB: &price},\n'''
          if old not in s:
              raise SystemExit('receiving PDF test marker not found')
          p.write_text(s.replace(old, new, 1))

          # UI: currentRetailRub is already the Saby selling price. The old UI never
          # rendered it and instead labelled currentUnitCostRub as "Текущая", which
          # made a 697-ruble cost look like the Saby price.
          p = Path('frontend/src/AdminProcurementDialogs.tsx')
          s = p.read_text()
          old_header = '''<th>Цена план / факт</th><th>Себестоимость</th><th></th>'''
          new_header = '''<th>Цена план / факт</th><th>Себестоимость</th><th>Розница СБИС / новая</th><th></th>'''
          if old_header not in s:
              raise SystemExit('frontend header marker not found')
          s = s.replace(old_header, new_header, 1)
          old_cell = '''<td>{line.unitCostRub == null ? "—" : money.format(line.unitCostRub)}<small>{line.currentUnitCostRub == null ? "Текущая: неизвестно" : `Текущая: ${money.format(line.currentUnitCostRub)} · ${line.currentUnitCostKind === "actual" ? "фактическая" : "оценочная"}`}</small></td><td><div className="procurement-inline-actions">'''
          new_cell = '''<td>{line.unitCostRub == null ? "—" : money.format(line.unitCostRub)}<small>{line.currentUnitCostRub == null ? "Учётная себестоимость: неизвестно" : `Учётная себестоимость: ${money.format(line.currentUnitCostRub)} · ${line.currentUnitCostKind === "actual" ? "фактическая" : "оценочная"}`}</small></td><td>{line.currentRetailRub > 0 ? money.format(line.currentRetailRub) : "—"} / {line.proposedRetailRub == null ? "—" : money.format(line.proposedRetailRub)}<small>СБИС сейчас / новая по формуле</small></td><td><div className="procurement-inline-actions">'''
          if old_cell not in s:
              raise SystemExit('frontend cost cell marker not found')
          p.write_text(s.replace(old_cell, new_cell, 1))
          PY
          gofmt -w backend/internal/procurement/receiving_pdf.go backend/internal/procurement/receiving_pdf_test.go
          cd backend
          go test ./internal/procurement
          go vet ./...
          go build ./cmd/api
          cd ../frontend
          npm ci
          npm run lint
          npm run build
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add backend/internal/procurement/receiving_pdf.go backend/internal/procurement/receiving_pdf_test.go frontend/src/AdminProcurementDialogs.tsx
          git commit -m 'fix(procurement): align receiving PDF and show Saby retail price'
          git push origin HEAD:fix/procurement-pdf-and-price-display
