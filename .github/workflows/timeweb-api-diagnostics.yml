name: Read isolated staging realization settings
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-staging-order-sale-audit-280757
  cancel-in-progress: false
jobs:
  staging-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only database inspection client
        run: python3 -m pip install 'psycopg[binary]==3.2.13'
      - name: Verify isolated staging and read active warehouse identifiers
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: python3 scripts/timeweb-staging-order-sale-audit.py
