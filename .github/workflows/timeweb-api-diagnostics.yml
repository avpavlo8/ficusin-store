name: Read-only encrypted account timing audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: customer-timing-readonly-20261112
  cancel-in-progress: false
jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install driver
        run: python3 -m pip install 'psycopg[binary]==3.2.12'
      - name: Read account timing in a read-only database session and encrypt result
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/customer-registration-readonly-audit.py | openssl cms -encrypt -binary -aes-256-cbc -outform DER -out /tmp/customer-timing-audit.enc scripts/customer-audit-recipient.pem
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-customer-timing-audit
          path: /tmp/customer-timing-audit.enc
          retention-days: 1
          if-no-files-found: error
