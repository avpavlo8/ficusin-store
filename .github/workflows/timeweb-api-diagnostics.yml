name: Isolated staging storage modes
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply mock storage and publication modes only to existing app 280757
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: isolated-staging-storage-modes-280757
  cancel-in-progress: false
jobs:
  staging-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database driver for read-only isolation verification
        run: python3 -m pip install 'psycopg[binary]==3.2.12'
      - name: Verify isolated staging and inspect or apply only approved modes
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          APPLY_STAGING_MODES: ${{ inputs.apply }}
        run: python3 scripts/timeweb-staging-storage-modes.py
