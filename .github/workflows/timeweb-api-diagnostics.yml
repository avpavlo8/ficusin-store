name: Timeweb staging inspection
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [plan, provision, status, configure, activate, repair-health, seed]
        default: plan
      approved_monthly_rub:
        type: string
        default: '0'
      candidate_sha:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read existing application and available resources
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
        run: python3 scripts/timeweb-staging-inspect.py
      - name: Prepare or provision isolated staging
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          STAGING_ACCESS_TOKEN: ${{ secrets.STAGING_ACCESS_TOKEN }}
          STAGING_OPERATION: ${{ inputs.operation }}
          APPROVED_STAGING_MONTHLY_RUB: ${{ inputs.approved_monthly_rub }}
          STAGING_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 scripts/timeweb-staging-provision.py
      - name: Inspect or activate only the isolated staging application
        if: inputs.operation == 'status' || inputs.operation == 'activate' || inputs.operation == 'configure' || inputs.operation == 'repair-health'
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          STAGING_OPERATION: ${{ inputs.operation }}
          APPROVED_STAGING_MONTHLY_RUB: ${{ inputs.approved_monthly_rub }}
          STAGING_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 scripts/timeweb-staging-manage.py
      - name: Prepare isolated catalog and synthetic owner
        if: inputs.operation == 'seed'
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          STAGING_ACCESS_TOKEN: ${{ secrets.STAGING_ACCESS_TOKEN }}
          APPROVED_STAGING_MONTHLY_RUB: ${{ inputs.approved_monthly_rub }}
        run: |
          python3 -m pip install 'psycopg[binary]==3.2.12'
          python3 scripts/timeweb-staging-seed.py
