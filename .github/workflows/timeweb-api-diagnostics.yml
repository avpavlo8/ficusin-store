name: Guard isolated staging realization mock settings
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply only the three approved mock realization settings to staging app 280757
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: isolated-staging-order-sale-modes-280757
  cancel-in-progress: false
jobs:
  staging-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only database preflight client
        run: python3 -m pip install 'psycopg[binary]==3.2.13'
      - name: Inspect or explicitly apply only approved staging mock settings
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          APPLY_STAGING_ORDER_MODES: ${{ inputs.apply }}
        run: python3 scripts/timeweb-staging-order-sale-modes.py
