name: Apply procurement trolley repair and price highlight
on:
  push:
    branches: [fix/procurement-auto-trolleys-price-highlight]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/procurement-auto-trolleys-price-highlight
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Patch procurement behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Existing invoices imported before the trolley fix still contain
          # planning placeholder `shelf`. Repair those rows before OrderDetail
          # is read, so validation/UI immediately sees Box no 1/2 and the user
          # never has to enter a trolley manually or press Calculate first.
          replace_once(
              "backend/internal/procurement/postgres.go",
              "func (store *PostgresStore) OrderDetail(ctx context.Context, orderID int64) (OrderDetail, error) {\n\torder, err := loadOrderSummary(ctx, store.pool, orderID)",
              "func (store *PostgresStore) OrderDetail(ctx context.Context, orderID int64) (OrderDetail, error) {\n\trepairTx, err := store.pool.Begin(ctx)\n\tif err != nil {\n\t\treturn OrderDetail{}, fmt.Errorf(\"begin invoice trolley repair: %w\", err)\n\t}\n\tif err := repairStoredInvoiceLoadUnits(ctx, repairTx, orderID); err != nil {\n\t\t_ = repairTx.Rollback(ctx)\n\t\treturn OrderDetail{}, err\n\t}\n\tif err := repairTx.Commit(ctx); err != nil {\n\t\treturn OrderDetail{}, fmt.Errorf(\"commit invoice trolley repair: %w\", err)\n\t}\n\torder, err := loadOrderSummary(ctx, store.pool, orderID)",
          )

          # Avoid reparsing every time after all legacy placeholders have been
          # healed. This also makes the read path effectively read-only after
          # the one-time repair.
          replace_once(
              "backend/internal/procurement/load_unit_repair.go",
              "\tif parserKind != \"holland_packing_list\" || strings.TrimSpace(extractedText) == \"\" {\n\t\treturn nil\n\t}\n\tparsed, err := ParseDocumentText(extractedText)",
              "\tif parserKind != \"holland_packing_list\" || strings.TrimSpace(extractedText) == \"\" {\n\t\treturn nil\n\t}\n\tvar needsRepair bool\n\tif err := tx.QueryRow(ctx, `\n\t\tSELECT EXISTS (\n\t\t\tSELECT 1 FROM procurement_order_lines\n\t\t\tWHERE procurement_order_id=$1 AND procurement_document_id=$2\n\t\t\t\tAND reconciliation_status<>'superseded'\n\t\t\t\tAND (BTRIM(load_unit)='' OR LOWER(BTRIM(load_unit))='shelf')\n\t\t)\n\t`, orderID, documentID).Scan(&needsRepair); err != nil {\n\t\treturn fmt.Errorf(\"check invoice trolley repair: %w\", err)\n\t}\n\tif !needsRepair {\n\t\treturn nil\n\t}\n\tparsed, err := ParseDocumentText(extractedText)",
          )

          # Restore the visual price-difference signal. The backend already
          # calculates priceChangeNeeded using the configured threshold; the
          # current table simply stopped using that field.
          old_price_cell = '<td>{line.currentRetailRub > 0 ? money.format(line.currentRetailRub) : "—"} / {line.proposedRetailRub == null ? "—" : money.format(line.proposedRetailRub)}<small>СБИС сейчас / новая по формуле</small></td>'
          new_price_cell = '<td className={line.priceChangeNeeded ? "procurement-retail-change" : ""}>{line.currentRetailRub > 0 ? money.format(line.currentRetailRub) : "—"} / <span className={line.priceChangeNeeded ? "procurement-price-new" : ""}>{line.proposedRetailRub == null ? "—" : money.format(line.proposedRetailRub)}</span><small>{line.priceChangeNeeded ? "СБИС сейчас / новая — требуется изменение" : "СБИС сейчас / новая по формуле"}</small></td>'
          replace_once("frontend/src/AdminProcurementDialogs.tsx", old_price_cell, new_price_cell)

          css = Path("frontend/src/styles/storefront.css")
          text = css.read_text()
          marker = "/* Procurement retail price delta */"
          if marker not in text:
              text += '''\n\n/* Procurement retail price delta */\n.procurement-lines td.procurement-retail-change {\n  background: rgba(188, 92, 58, 0.10);\n  box-shadow: inset 3px 0 0 rgba(164, 73, 44, 0.78);\n}\n.procurement-lines .procurement-price-new {\n  color: #9c4f35;\n  font-weight: 750;\n}\n.procurement-lines td.procurement-retail-change small {\n  color: #8d5947;\n  font-weight: 600;\n}\n'''
              css.write_text(text)

          # A regression guard: the detail read path must perform the repair,
          # not only CalculateOrder (which is disabled while validation fails).
          test = Path("backend/internal/procurement/load_unit_repair_test.go")
          text = test.read_text()
          if "TestOrderDetailRepairsLoadUnitsBeforeValidationSourceGuard" not in text:
              text += '''\nfunc TestOrderDetailRepairsLoadUnitsBeforeValidationSourceGuard(t *testing.T) {\n\tsource, err := os.ReadFile("postgres.go")\n\tif err != nil { t.Fatal(err) }\n\ttext := string(source)\n\tstart := strings.Index(text, "func (store *PostgresStore) OrderDetail")\n\tend := strings.Index(text[start:], "func (store *PostgresStore) loadOrderValidation")\n\tif start < 0 || end < 0 { t.Fatal("OrderDetail source not found") }\n\tbody := text[start:start+end]\n\tif !strings.Contains(body, "repairStoredInvoiceLoadUnits(ctx, repairTx, orderID)") {\n\t\tt.Fatal("OrderDetail must repair invoice load units before validation")\n\t}\n}\n'''
              text = text.replace('import "testing"', 'import (\n\t"os"\n\t"strings"\n\t"testing"\n)')
              test.write_text(text)
          PY

          gofmt -w backend/internal/procurement/load_unit_repair_test.go backend/internal/procurement/postgres.go backend/internal/procurement/load_unit_repair.go

      - name: Verify backend
        working-directory: backend
        run: |
          go test ./internal/procurement ./internal/integration ./internal/saby
          go vet ./...
          go build ./cmd/api
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          grep -q 'procurement-retail-change' src/AdminProcurementDialogs.tsx
          grep -q 'Procurement retail price delta' src/styles/storefront.css
      - name: Commit fix
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add backend frontend
          git commit -m 'fix(procurement): auto-repair trolleys and highlight price changes'
          git push origin HEAD:fix/procurement-auto-trolleys-price-highlight
