name: One-off procurement alias hotfix

on:
  push:
    branches: [fix/procurement-alias-upsert-numeric]
    paths:
      - .github/workflows/oneoff-fix-procurement-alias.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/procurement-alias-upsert-numeric
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - name: Patch numeric alias conflict fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/internal/procurement/postgres_actions.go')
          text = path.read_text()
          old = """\t\t\t\tAND COALESCE(pot_diameter_cm, -1) = COALESCE($5, -1)\n\t\t\t\tAND COALESCE(height_cm, -1) = COALESCE($6, -1)"""
          new = """\t\t\t\tAND pot_diameter_cm IS NOT DISTINCT FROM $5::NUMERIC(6,1)\n\t\t\t\tAND height_cm IS NOT DISTINCT FROM $6::NUMERIC(6,1)"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one alias fallback block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          gofmt -w backend/internal/procurement/postgres_actions.go backend/internal/procurement/alias_upsert_live_test.go
          git diff --check
      - name: Compile and unit test backend
        working-directory: backend
        run: go test ./...
      - name: Commit hotfix and remove one-off workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/oneoff-fix-procurement-alias.yml
          git add backend/internal/procurement/postgres_actions.go backend/internal/procurement/alias_upsert_live_test.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(procurement): preserve numeric alias dimensions on conflict'
          git push origin HEAD:fix/procurement-alias-upsert-numeric
