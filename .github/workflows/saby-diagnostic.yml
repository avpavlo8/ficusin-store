name: Saby catalog diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/saby-diagnostic.yml"

permissions:
  contents: read
  statuses: write

jobs:
  check-saby:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SABY_APP_CLIENT_ID: ${{ secrets.SABY_APP_CLIENT_ID }}
      SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
      SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
      SABY_POINT_ID: "278"
      SABY_PRICE_LIST_ID: "6"
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Verify catalog access without exposing business data
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          state = "failure"
          description = "Saby diagnostic failed"
          context = "saby/catalog/failed"

          def load_json(request):
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          try:
              required = (
                  "SABY_APP_CLIENT_ID",
                  "SABY_APP_SECRET",
                  "SABY_SECRET_KEY",
                  "SABY_POINT_ID",
                  "SABY_PRICE_LIST_ID",
              )
              if any(not os.environ.get(name) for name in required):
                  raise RuntimeError("missing settings")

              auth_request = urllib.request.Request(
                  "https://online.sbis.ru/oauth/service/",
                  data=json.dumps({
                      "app_client_id": os.environ["SABY_APP_CLIENT_ID"],
                      "app_secret": os.environ["SABY_APP_SECRET"],
                      "secret_key": os.environ["SABY_SECRET_KEY"],
                  }).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              token = load_json(auth_request).get("token")
              if not token:
                  raise RuntimeError("no token")

              params = urllib.parse.urlencode({
                  "pointId": os.environ["SABY_POINT_ID"],
                  "priceListId": os.environ["SABY_PRICE_LIST_ID"],
                  "withBalance": "true",
                  "withBarcode": "true",
                  "page": 0,
                  "pageSize": 25,
              })
              catalog_request = urllib.request.Request(
                  "https://api.sbis.ru/retail/v2/nomenclature/list?" + params,
                  headers={"X-SBISAccessToken": token},
              )
              catalog = load_json(catalog_request)
              items = (
                  catalog.get("nomenclatures")
                  or catalog.get("items")
                  or catalog.get("products")
                  or []
              )
              if not items:
                  raise RuntimeError("empty catalog")

              priced = sum(item.get("cost") is not None for item in items)
              balanced = sum(item.get("balance") is not None for item in items)
              pictured = sum(bool(item.get("images")) for item in items)

              if priced == 0:
                  raise RuntimeError("no prices")
              if balanced == 0:
                  raise RuntimeError("no balances")

              state = "success"
              description = "Saby catalog fields verified"
              context = (
                  f"saby/catalog/r{len(items)}-p{priced}-"
                  f"b{balanced}-i{pictured}"
              )
          except Exception:
              state = "failure"
              description = "Saby diagnostic failed; inspect Actions log"
              context = "saby/catalog/failed"

          repository = os.environ["GITHUB_REPOSITORY"]
          commit_sha = os.environ["GITHUB_SHA"]
          status_request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/statuses/{commit_sha}",
              data=json.dumps({
                  "state": state,
                  "description": description,
                  "context": context,
              }).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          load_json(status_request)
          print(description)

          if state != "success":
              raise SystemExit(1)
          PY
