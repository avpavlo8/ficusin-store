name: One-off Saby procurement search fix

on:
  push:
    branches: [fix/saby-procurement-flower-search]
    paths:
      - .github/workflows/oneoff-fix-saby-procurement-search.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saby-procurement-flower-search
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - name: Preserve Saby section path
        run: |
          python3 -c 'from pathlib import Path; p=Path("backend/internal/saby/service.go"); s=p.read_text(); old="PriceMinor: item.costMinor, Balance: item.balance, Images: item.images, Attributes: item.attributes,\n\t\t})"; new="PriceMinor: item.costMinor, Balance: item.balance, Images: item.images, Attributes: item.attributes,\n\t\t\tSectionPath: item.sectionPath,\n\t\t})"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
      - name: Limit procurement search to two flower folders
        run: |
          python3 -c 'from pathlib import Path; p=Path("backend/internal/procurement/postgres_catalogue.go"); s=p.read_text(); old="WHERE LOWER(BTRIM(part)) IN (LOWER('"'"'Цветы'"'"'), LOWER('"'"'Цветы Marketplace'"'"'), LOWER('"'"'Комнатные растения'"'"'))"; new="WHERE LOWER(BTRIM(part)) IN (LOWER('"'"'Цветы'"'"'), LOWER('"'"'Цветы маркетплейс'"'"'))"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
      - name: Make interactive Saby refresh responsive
        run: |
          python3 -c 'from pathlib import Path; p=Path("backend/internal/procurement/catalog_worker.go"); s=p.read_text(); old="poll: time.Minute}"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,"poll: 5 * time.Second}",1))'
          gofmt -w backend/internal/saby/service.go backend/internal/procurement/postgres_catalogue.go backend/internal/procurement/catalog_worker.go
          git diff --check
          grep -Fq 'SectionPath: item.sectionPath' backend/internal/saby/service.go
          grep -Fq "LOWER('Цветы маркетплейс')" backend/internal/procurement/postgres_catalogue.go
      - name: Test backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/api
      - name: Commit fix and remove one-off workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/oneoff-fix-saby-procurement-search.yml
          git add backend/internal/saby/service.go backend/internal/procurement/postgres_catalogue.go backend/internal/procurement/catalog_worker.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(procurement): restore Saby flower search'
          git push origin HEAD:fix/saby-procurement-flower-search
