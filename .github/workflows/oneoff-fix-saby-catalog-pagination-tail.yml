name: Apply Saby catalogue pagination fix
on:
  push:
    branches:
      - fix/saby-catalog-pagination-tail
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saby-catalog-pagination-tail
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Apply patch
        run: python3 scripts/oneoff_fix_saby_catalog_pagination.py
      - name: Verify backend
        working-directory: backend
        run: |
          go test ./internal/integration ./internal/saby
          go vet ./...
          go build ./cmd/api
      - name: Commit fix
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add backend/internal/integration/saby_procurement.go backend/internal/integration/saby_procurement_test.go
          git diff --cached --quiet && exit 0
          git commit -m "fix(saby): keep paging past duplicate catalogue rows"
          git push origin HEAD:fix/saby-catalog-pagination-tail
