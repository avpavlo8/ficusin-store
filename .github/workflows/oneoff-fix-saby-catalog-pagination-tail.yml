name: Apply Saby catalogue pagination fix
on:
  push:
    branches:
      - fix/saby-catalog-pagination-tail
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saby-catalog-pagination-tail
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Patch Saby catalogue pagination
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('backend/internal/integration/saby_procurement.go')
          text = p.read_text()
          old = '''\t\tvar page sabyCatalogPage\n\t\tif err := client.authorizedJSON(ctx, http.MethodGet, client.apiBase+"/retail/v2/nomenclature/list?"+query.Encode(), nil, &page); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tfresh := 0\n\t\tfor _, item := range page.rows() {\n\t\t\tkey := sabyValue(item["hierarchicalId"])\n\t\t\tif key == "" {\n\t\t\t\tkey = sabyValue(item["id"])\n\t\t\t}\n\t\t\tif key == "" || seenRows[key] {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tseenRows[key] = true\n\t\t\titem["sectionPath"] = append([]string(nil), sectionPath...)\n\t\t\trows = append(rows, item)\n\t\t\tfresh++\n\t\t}\n\t\tif fresh == 0 {\n\t\t\tbreak\n\t\t}\n'''
          new = '''\t\tvar page sabyCatalogPage\n\t\tif err := client.authorizedJSON(ctx, http.MethodGet, client.apiBase+"/retail/v2/nomenclature/list?"+query.Encode(), nil, &page); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tpageRows := page.rows()\n\t\t// Saby can repeat rows on adjacent pages while still having newer cards\n\t\t// on later pages. Stop only when the API returns an actually empty page;\n\t\t// using "no fresh IDs" as EOF silently truncated recently created goods.\n\t\tif len(pageRows) == 0 {\n\t\t\tbreak\n\t\t}\n\t\tfor _, item := range pageRows {\n\t\t\tkey := sabyValue(item["hierarchicalId"])\n\t\t\tif key == "" {\n\t\t\t\tkey = sabyValue(item["id"])\n\t\t\t}\n\t\t\tif key == "" || seenRows[key] {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tseenRows[key] = true\n\t\t\titem["sectionPath"] = append([]string(nil), sectionPath...)\n\t\t\trows = append(rows, item)\n\t\t}\n'''
          if old not in text:
              raise SystemExit('pagination block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('backend/internal/integration/saby_procurement_test.go')
          text = p.read_text()
          marker = '''func TestSabyCatalogPageAcceptsObjectWrappedRows(t *testing.T) {\n'''
          test = r'''func TestSabyCatalogPaginationContinuesPastDuplicateOnlyPage(t *testing.T) {
\tvar pages []int
\tserver := httptest.NewServer(http.HandlerFunc(func(response http.ResponseWriter, request *http.Request) {
\t\tresponse.Header().Set("Content-Type", "application/json")
\t\tif request.URL.Path == "/oauth/service/" {
\t\t\t_, _ = response.Write([]byte(`{"token":"safe-token"}`))
\t\t\treturn
\t\t}
\t\tpage, _ := strconv.Atoi(request.URL.Query().Get("page"))
\t\tpages = append(pages, page)
\t\tswitch page {
\t\tcase 0:
\t\t\t_, _ = response.Write([]byte(`{"nomenclatures":[{"id":"101","name":"Антуриум Beauty Black"}]}`))
\t\tcase 1:
\t\t\t// Saby may repeat the previous row on a page boundary. This must not
\t\t\t// be interpreted as end-of-catalogue.
\t\t\t_, _ = response.Write([]byte(`{"nomenclatures":[{"id":"101","name":"Антуриум Beauty Black"}]}`))
\t\tcase 2:
\t\t\t_, _ = response.Write([]byte(`{"nomenclatures":[{"id":"102","name":"Антуриум Black Love"},{"id":"103","name":"Антуриум Melodia Ibis"}]}`))
\t\tdefault:
\t\t\t_, _ = response.Write([]byte(`{"nomenclatures":[]}`))
\t\t}
\t}))
\tdefer server.Close()

\tclient := NewSabyClient("client", "secret", "service", 278, 6)
\tclient.authURL, client.apiBase, client.client = server.URL+"/oauth/service/", server.URL, server.Client()
\trows, err := client.fetchCatalogSection(context.Background(), url.Values{"pointId": {"278"}, "pageSize": {"1000"}}, "", map[string]bool{}, 0, nil)
\tif err != nil {
\t\tt.Fatal(err)
\t}
\tif len(rows) != 3 {
\t\tt.Fatalf("rows=%d pages=%v; duplicate-only page truncated catalogue", len(rows), pages)
\t}
\tif sabyValue(rows[1]["id"]) != "102" || sabyValue(rows[2]["id"]) != "103" {
\t\tt.Fatalf("rows=%+v", rows)
\t}
\tif fmt.Sprint(pages) != "[0 1 2 3]" {
\t\tt.Fatalf("pages=%v", pages)
\t}
}

'''
          if marker not in text:
              raise SystemExit('test marker not found')
          text = text.replace(marker, test + marker, 1)
          # net/url is needed by the regression test.
          text = text.replace('"net/http/httptest"\n', '"net/http/httptest"\n\t"net/url"\n', 1)
          p.write_text(text)
          PY
      - name: Verify backend
        working-directory: backend
        run: |
          go test ./internal/integration ./internal/saby
          go vet ./...
          go build ./cmd/api
      - name: Commit fix
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add backend/internal/integration/saby_procurement.go backend/internal/integration/saby_procurement_test.go
          git diff --cached --quiet && exit 0
          git commit -m "fix(saby): keep paging past duplicate catalogue rows"
          git push origin HEAD:fix/saby-catalog-pagination-tail
