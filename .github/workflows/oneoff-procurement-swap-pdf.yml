name: Patch procurement invoice swap and receiving PDF
on:
  push:
    branches: [fix/procurement-invoice-swap-receiving-pdf]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/procurement-invoice-swap-receiving-pdf
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply procurement patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          # Frontend: download printable receiving PDF.
          path = Path('frontend/src/AdminProcurementDialogs.tsx')
          text = path.read_text()
          marker = '''  const prepare = async (kind: "receipt" | "prices") => {'''
          insert = '''  const downloadReceivingPDF = async () => {
    const response = await fetch(`/api/v1/admin/procurement/orders/${orderId}/receiving.pdf`, { credentials: "same-origin", cache: "no-store" });
    if (!response.ok) {
      const result = await response.json().catch(() => ({})) as { error?: string };
      throw new Error(result.error || "Не удалось сформировать PDF приёмки");
    }
    const blob = await response.blob(); const url = URL.createObjectURL(blob);
    const link = document.createElement("a"); link.href = url;
    link.download = response.headers.get("Content-Disposition")?.match(/filename="([^\"]+)"/)?.[1] || `receiving-${orderId}.pdf`;
    document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
  };
  const prepare = async (kind: "receipt" | "prices") => {'''
          if marker not in text:
              raise SystemExit('prepare marker not found')
          text = text.replace(marker, insert, 1)

          old = '''  const pendingInvoiceLines = detail?.lines.filter((line) => line.reconciliationStatus === "added" && !line.comparisonAccepted && !line.invoiceExcluded) || [];
  const visibleLines = detail?.lines.filter((line) => line.reconciliationStatus !== "added" || line.comparisonAccepted || line.invoiceExcluded) || [];
  const changedLines = detail?.lines.filter((line) => line.reconciliationStatus === "changed" && line.comparisonMismatch && !line.comparisonAccepted && !line.invoiceExcluded) || [];
  const pairingLine = pairingLineID == null ? null : detail?.lines.find((line) => line.id === pairingLineID) || null;'''
          new = '''  const pendingInvoiceLines = detail?.lines.filter((line) => line.reconciliationStatus === "added" && !line.comparisonAccepted && !line.invoiceExcluded) || [];
  const visibleLines = detail?.lines.filter((line) => line.reconciliationStatus !== "added" || line.comparisonAccepted || line.invoiceExcluded) || [];
  const changedLines = detail?.lines.filter((line) => line.reconciliationStatus === "changed" && line.comparisonMismatch && !line.comparisonAccepted && !line.invoiceExcluded) || [];
  const pairingLine = pairingLineID == null ? null : detail?.lines.find((line) => line.id === pairingLineID) || null;
  const invoicePairCandidates = detail?.lines.filter((line) => line.id !== pairingLineID && !line.invoiceExcluded && line.reconciliationStatus !== "superseded" && line.invoicedQuantity != null && ((line.reconciliationStatus === "added" && !line.comparisonAccepted) || (line.orderedQuantity > 0 && ["matched", "changed"].includes(line.reconciliationStatus)))) || [];'''
          if old not in text:
              raise SystemExit('invoice filter marker not found')
          text = text.replace(old, new, 1)

          old_pair = '''      {pairingLine && <section className="procurement-checklist blocked"><strong>Выберите строку инвойса для «{pairingLine.sabyName || pairingLine.rawName}»</strong><p>После выбора данные инвойса перейдут в исходную строку закупки. Плановая цена и количество сохранятся для сравнения.</p><div className="admin-table-wrap"><table className="admin-table procurement-lines"><thead><tr><th>Строка инвойса</th><th>Количество</th><th>Цена</th><th></th></tr></thead><tbody>{pendingInvoiceLines.map((invoiceLine) => <tr key={invoiceLine.id}><td><strong>{invoiceLine.invoiceRawName || invoiceLine.rawName}</strong><small>{invoiceLine.invoiceSupplierArticle || "Артикул не указан"}</small></td><td>{invoiceLine.invoicedQuantity ?? "—"}</td><td>{invoiceLine.unitPrice.toFixed(2)} {detail.order.currency}</td><td><button disabled={saving} onClick={() => void matchInvoiceLine(pairingLine, invoiceLine)}>Сопоставить</button></td></tr>)}</tbody></table></div><div className="dialog-actions"><button onClick={() => setPairingLineID(null)}>Отмена</button></div></section>}'''
          new_pair = '''      {pairingLine && <section className="procurement-checklist blocked"><strong>Выберите правильную строку инвойса для «{pairingLine.sabyName || pairingLine.rawName}»</strong><p>{pairingLine.reconciliationStatus === "missing" ? "После выбора строка инвойса перейдёт в исходную позицию закупки." : "Можно выбрать строку, которая сейчас привязана к другому товару: система поменяет две строки инвойса местами, сохранив товары СБИС и плановые параметры."}</p><div className="admin-table-wrap"><table className="admin-table procurement-lines"><thead><tr><th>Строка инвойса</th><th>Сейчас привязана к</th><th>Размер · упаковка</th><th>Количество</th><th>Цена</th><th></th></tr></thead><tbody>{invoicePairCandidates.map((invoiceLine) => <tr key={invoiceLine.id}><td><strong>{invoiceLine.invoiceRawName || invoiceLine.rawName}</strong><small>{invoiceLine.invoiceSupplierArticle || "Артикул не указан"}</small></td><td>{invoiceLine.reconciliationStatus === "added" ? <span>Не сопоставлена</span> : <><strong>{invoiceLine.sabyName || invoiceLine.rawName}</strong><small>{invoiceLine.sabyId}</small></>}</td><td>{[invoiceLine.potDiameterCm && `D${invoiceLine.potDiameterCm}`, invoiceLine.heightCm && `${invoiceLine.heightCm} см`].filter(Boolean).join(" · ") || "—"}<small>{invoiceLine.unitsPerPackage && invoiceLine.packageCount ? `${invoiceLine.unitsPerPackage} × ${invoiceLine.packageCount} (шт. × мест)` : "Упаковка не указана"}</small></td><td>{invoiceLine.invoicedQuantity ?? "—"}</td><td>{invoiceLine.unitPrice.toFixed(2)} {detail.order.currency}</td><td><button disabled={saving} onClick={() => void matchInvoiceLine(pairingLine, invoiceLine)}>{invoiceLine.reconciliationStatus === "added" ? "Сопоставить" : "Поменять местами"}</button></td></tr>)}</tbody></table></div>{invoicePairCandidates.length === 0 && <div className="procurement-zero"><span>Других строк инвойса для выбора нет.</span></div>}<div className="dialog-actions"><button onClick={() => setPairingLineID(null)}>Отмена</button></div></section>}'''
          if old_pair not in text:
              raise SystemExit('pairing JSX marker not found')
          text = text.replace(old_pair, new_pair, 1)

          old_actions = '''<td><div className="procurement-inline-actions"><button onClick={() => void editLine(line)}>Размеры</button>{line.reconciliationStatus === "changed" && line.comparisonMismatch && !line.comparisonAccepted && !line.invoiceExcluded && <button onClick={() => void acceptMismatch(line)}>Принять расхождение</button>}{line.reconciliationStatus === "missing" && !line.invoiceExcluded && pendingInvoiceLines.length > 0 && <button onClick={() => setPairingLineID(line.id)}>Выбрать из инвойса</button>}{["missing","added","changed"].includes(line.reconciliationStatus) && !line.invoiceExcluded && <button onClick={() => void setInvoiceExcluded(line, true)}>Исключить</button>}{line.invoiceExcluded && <button onClick={() => void setInvoiceExcluded(line, false)}>Вернуть в сверку</button>}</div></td>'''
          new_actions = '''<td><div className="procurement-inline-actions"><button onClick={() => void editLine(line)}>Размеры</button>{line.reconciliationStatus === "changed" && line.comparisonMismatch && !line.comparisonAccepted && !line.invoiceExcluded && <button onClick={() => void acceptMismatch(line)}>Принять расхождение</button>}{line.reconciliationStatus === "missing" && !line.invoiceExcluded && pendingInvoiceLines.length > 0 && <button onClick={() => setPairingLineID(line.id)}>Выбрать из инвойса</button>}{["matched","changed"].includes(line.reconciliationStatus) && !line.invoiceExcluded && line.invoicedQuantity != null && invoicePairCandidates.length > 0 && <button onClick={() => setPairingLineID(line.id)}>Сменить строку инвойса</button>}{["missing","added","changed"].includes(line.reconciliationStatus) && !line.invoiceExcluded && <button onClick={() => void setInvoiceExcluded(line, true)}>Исключить</button>}{line.invoiceExcluded && <button onClick={() => void setInvoiceExcluded(line, false)}>Вернуть в сверку</button>}</div></td>'''
          if old_actions not in text:
              raise SystemExit('row action marker not found')
          text = text.replace(old_actions, new_actions, 1)

          old_ready = '''{detail.order.status === "ready_to_receive" && <><fieldset className="procurement-price-channels">'''
          new_ready = '''{detail.order.status === "ready_to_receive" && <><div className="procurement-batch-buttons"><button className="admin-primary" disabled={saving || !detail.validation.canPrepareActions} onClick={() => void downloadReceivingPDF().catch((error) => onError((error as Error).message))}>Скачать PDF приёмки</button><small>Печатный лист: название СБИС, рассчитанная цена, количество, упаковка и размеры.</small></div><fieldset className="procurement-price-channels">'''
          if old_ready not in text:
              raise SystemExit('ready section marker not found')
          text = text.replace(old_ready, new_ready, 1)
          path.write_text(text)

          # Backend: allow swapping invoice assignments between already matched plan rows.
          path = Path('backend/internal/procurement/postgres_catalogue.go')
          text = path.read_text()
          pattern = re.compile(r'func pairInvoiceLineWithPlan\(ctx context\.Context, tx pgx\.Tx, actorID, orderID, plannedID, invoiceID int64\) error \{.*?\n\}\n\nfunc \(store \*PostgresStore\) UpdateOrderLine', re.S)
          replacement = r'''func pairInvoiceLineWithPlan(ctx context.Context, tx pgx.Tx, actorID, orderID, plannedID, invoiceID int64) error {
	var plannedSaby string
	var plannedCanonical int64
	var aliasID, documentID int64
	var sourceLine int
	err := tx.QueryRow(ctx, `
		SELECT COALESCE(planned.saby_id,''),COALESCE(planned.canonical_variant_id,
			(SELECT variant_id FROM canonical_product_directory WHERE active AND saby_id=planned.saby_id ORDER BY variant_id LIMIT 1),0),
			invoice.supplier_alias_id,invoice.procurement_document_id,invoice.source_line
		FROM procurement_order_lines planned
		JOIN procurement_order_lines invoice ON invoice.procurement_order_id=planned.procurement_order_id
		WHERE planned.id=$1 AND planned.procurement_order_id=$2
			AND planned.ordered_qty>0 AND planned.procurement_document_id IS NULL
			AND planned.reconciliation_status='missing' AND NOT planned.invoice_excluded
			AND invoice.id=$3 AND invoice.ordered_qty=0 AND invoice.procurement_document_id IS NOT NULL
			AND invoice.source_line IS NOT NULL AND invoice.supplier_alias_id IS NOT NULL
			AND invoice.reconciliation_status='added' AND NOT invoice.invoice_excluded
		FOR UPDATE OF planned,invoice
	`, plannedID, orderID, invoiceID).Scan(&plannedSaby, &plannedCanonical, &aliasID, &documentID, &sourceLine)
	if errors.Is(err, pgx.ErrNoRows) {
		return swapInvoiceAssignmentsBetweenPlans(ctx, tx, actorID, orderID, plannedID, invoiceID)
	}
	if err != nil {
		return fmt.Errorf("lock manual procurement reconciliation pair: %w", err)
	}
	if plannedSaby != "" {
		if err := remapProcurementAlias(ctx, tx, actorID, aliasID, plannedSaby, plannedCanonical); err != nil {
			return err
		}
	}
	// Release the document/source-line unique key before transferring invoice
	// provenance to the buyer's original planned row.
	if _, err := tx.Exec(ctx, `UPDATE procurement_order_lines SET procurement_document_id=NULL,
		reconciliation_status='superseded',updated_at=CURRENT_TIMESTAMP WHERE id=$1`, invoiceID); err != nil {
		return fmt.Errorf("supersede manually matched supplier line: %w", err)
	}
	if _, err := tx.Exec(ctx, `UPDATE procurement_order_lines planned SET
		procurement_document_id=$3,supplier_alias_id=invoice.supplier_alias_id,
		canonical_variant_id=CASE WHEN $5>0 THEN $5 ELSE COALESCE(invoice.canonical_variant_id,planned.canonical_variant_id) END,
		invoice_raw_name=invoice.invoice_raw_name,invoice_supplier_article=invoice.invoice_supplier_article,
		invoiced_qty=invoice.invoiced_qty,unit_price=invoice.unit_price,line_total=invoice.line_total,
		match_status=CASE WHEN $6<>'' THEN 'confirmed' ELSE invoice.match_status END,
		source_page=invoice.source_page,source_line=$4,comparison_accepted=FALSE,comparison_note='',
		reconciliation_status=CASE WHEN planned.ordered_qty IS DISTINCT FROM invoice.invoiced_qty
			OR planned.expected_unit_price IS NULL OR invoice.unit_price IS NULL
			OR ABS(planned.expected_unit_price-invoice.unit_price)>.005 THEN 'changed' ELSE 'matched' END,
		updated_at=CURRENT_TIMESTAMP
		FROM procurement_order_lines invoice WHERE planned.id=$1 AND invoice.id=$2`,
		plannedID, invoiceID, documentID, sourceLine, plannedCanonical, plannedSaby); err != nil {
		return fmt.Errorf("merge supplier invoice row into procurement plan: %w", err)
	}
	return nil
}

type procurementInvoiceAssignment struct {
	aliasID     int64
	documentID  int64
	rawName     string
	article     string
	quantity    int
	unitPrice   float64
	lineTotal   float64
	sourcePage  int
	sourceLine  int
}

type procurementPlanIdentity struct {
	id        int64
	sabyID    string
	canonical int64
	invoice   procurementInvoiceAssignment
}

func swapInvoiceAssignmentsBetweenPlans(ctx context.Context, tx pgx.Tx, actorID, orderID, firstID, secondID int64) error {
	if firstID == secondID {
		return &UserFacingError{Message: "Выберите другую строку инвойса"}
	}
	rows, err := tx.Query(ctx, `
		SELECT line.id,COALESCE(line.saby_id,''),COALESCE(line.canonical_variant_id,
			(SELECT variant_id FROM canonical_product_directory WHERE active AND saby_id=line.saby_id ORDER BY variant_id LIMIT 1),0),
			line.supplier_alias_id,line.procurement_document_id,line.invoice_raw_name,line.invoice_supplier_article,
			COALESCE(line.invoiced_qty,0),COALESCE(line.unit_price,0)::DOUBLE PRECISION,COALESCE(line.line_total,0)::DOUBLE PRECISION,
			COALESCE(line.source_page,0),line.source_line
		FROM procurement_order_lines line
		WHERE line.procurement_order_id=$1 AND line.id IN($2,$3)
			AND line.ordered_qty>0 AND line.procurement_document_id IS NOT NULL
			AND line.supplier_alias_id IS NOT NULL AND line.source_line IS NOT NULL
			AND line.reconciliation_status IN('matched','changed') AND NOT line.invoice_excluded
		ORDER BY line.id FOR UPDATE
	`, orderID, firstID, secondID)
	if err != nil {
		return fmt.Errorf("query invoice assignments for swap: %w", err)
	}
	defer rows.Close()
	plans := make(map[int64]procurementPlanIdentity, 2)
	for rows.Next() {
		var plan procurementPlanIdentity
		if err := rows.Scan(&plan.id, &plan.sabyID, &plan.canonical, &plan.invoice.aliasID, &plan.invoice.documentID,
			&plan.invoice.rawName, &plan.invoice.article, &plan.invoice.quantity, &plan.invoice.unitPrice,
			&plan.invoice.lineTotal, &plan.invoice.sourcePage, &plan.invoice.sourceLine); err != nil {
			return fmt.Errorf("scan invoice assignment for swap: %w", err)
		}
		plans[plan.id] = plan
	}
	if err := rows.Err(); err != nil {
		return err
	}
	first, firstOK := plans[firstID]
	second, secondOK := plans[secondID]
	if !firstOK || !secondOK || first.sabyID == "" || second.sabyID == "" {
		return &UserFacingError{Message: "Эти строки нельзя поменять местами. Обновите закупку и выберите две сопоставленные позиции"}
	}
	if first.invoice.aliasID == second.invoice.aliasID && first.sabyID != second.sabyID {
		return &UserFacingError{Message: "У этих строк один ключ поставщика. Сначала уточните размеры, чтобы разделить варианты товара"}
	}
	if err := remapProcurementAlias(ctx, tx, actorID, second.invoice.aliasID, first.sabyID, first.canonical); err != nil {
		return err
	}
	if err := remapProcurementAlias(ctx, tx, actorID, first.invoice.aliasID, second.sabyID, second.canonical); err != nil {
		return err
	}
	// Free one unique (document, source_line) slot, then rotate the two invoice
	// assignments. Planned Saby cards, planned prices, dimensions and packaging
	// remain on their original rows.
	if _, err := tx.Exec(ctx, `UPDATE procurement_order_lines SET procurement_document_id=NULL,updated_at=CURRENT_TIMESTAMP WHERE id=$1`, firstID); err != nil {
		return fmt.Errorf("release invoice assignment for swap: %w", err)
	}
	if err := applyProcurementInvoiceAssignment(ctx, tx, secondID, second, first.invoice); err != nil {
		return err
	}
	if err := applyProcurementInvoiceAssignment(ctx, tx, firstID, first, second.invoice); err != nil {
		return err
	}
	return nil
}

func remapProcurementAlias(ctx context.Context, tx pgx.Tx, actorID, aliasID int64, sabyID string, canonical int64) error {
	if _, err := tx.Exec(ctx, `UPDATE procurement_supplier_aliases SET
		matched_saby_id=$2,canonical_variant_id=NULLIF($3,0),match_status='confirmed',confidence=1,updated_at=CURRENT_TIMESTAMP
		WHERE id=$1`, aliasID, sabyID, canonical); err != nil {
		return fmt.Errorf("confirm supplier alias from manual invoice match: %w", err)
	}
	if _, err := tx.Exec(ctx, `INSERT INTO procurement_supplier_products(
		supplier_id,saby_id,canonical_variant_id,supplier_article,availability_status,updated_by)
		SELECT supplier_id,$2,NULLIF($3,0),supplier_article,'available',NULLIF($4,0)
		FROM procurement_supplier_aliases WHERE id=$1
		ON CONFLICT (supplier_id,saby_id) DO UPDATE SET
			canonical_variant_id=COALESCE(EXCLUDED.canonical_variant_id,procurement_supplier_products.canonical_variant_id),
			supplier_article=CASE WHEN EXCLUDED.supplier_article<>'' THEN EXCLUDED.supplier_article ELSE procurement_supplier_products.supplier_article END,
			availability_status='available',updated_by=EXCLUDED.updated_by,updated_at=CURRENT_TIMESTAMP`,
		aliasID, sabyID, canonical, actorID); err != nil {
		return fmt.Errorf("remember supplier product from manual invoice match: %w", err)
	}
	return nil
}

func applyProcurementInvoiceAssignment(ctx context.Context, tx pgx.Tx, lineID int64, plan procurementPlanIdentity, invoice procurementInvoiceAssignment) error {
	if _, err := tx.Exec(ctx, `UPDATE procurement_order_lines SET
		procurement_document_id=$2,supplier_alias_id=$3,invoice_raw_name=$4,invoice_supplier_article=$5,
		invoiced_qty=$6,unit_price=$7,line_total=$8,source_page=NULLIF($9,0),source_line=$10,
		match_status='confirmed',canonical_variant_id=NULLIF($11,0),comparison_accepted=FALSE,comparison_note='',
		reconciliation_status=CASE WHEN ordered_qty IS DISTINCT FROM $6::INTEGER
			OR expected_unit_price IS NULL OR ABS(expected_unit_price-$7::NUMERIC)>.005 THEN 'changed' ELSE 'matched' END,
		purchase_unit_rub=NULL,trolley_delivery_unit_rub=NULL,ryazan_delivery_unit_rub=NULL,unit_cost_rub=NULL,
		proposed_retail_rub=NULL,proposed_marketplace_rub=NULL,proposed_marketplace_strike_rub=NULL,updated_at=CURRENT_TIMESTAMP
		WHERE id=$1`, lineID, invoice.documentID, invoice.aliasID, invoice.rawName, invoice.article,
		invoice.quantity, invoice.unitPrice, invoice.lineTotal, invoice.sourcePage, invoice.sourceLine, plan.canonical); err != nil {
		return fmt.Errorf("apply swapped invoice assignment: %w", err)
	}
	return nil
}

func (store *PostgresStore) UpdateOrderLine'''
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'pairInvoiceLineWithPlan replacement count={n}')
          path.write_text(text)

          # Printable receiving PDF service.
          path = Path('backend/internal/procurement/service.go')
          text = path.read_text()
          marker = '''func NewService(store Store) *Service {'''
          method = '''func (service *Service) ReceivingPDF(ctx context.Context, orderID int64) ([]byte, string, error) {
	if orderID <= 0 {
		return nil, "", ErrInvalidInput
	}
	detail, err := service.store.OrderDetail(ctx, orderID)
	if err != nil {
		return nil, "", err
	}
	if detail.Order.Status != "ready_to_receive" || !detail.Validation.CanPrepareActions {
		return nil, "", &UserFacingError{Message: "PDF приёмки доступен после полной сверки и расчёта закупки"}
	}
	content, count, err := BuildReceivingPDF(detail)
	if err != nil {
		return nil, "", err
	}
	return content, fmt.Sprintf("receiving-%d-%d-items.pdf", orderID, count), nil
}

func NewService(store Store) *Service {'''
          if marker not in text:
              raise SystemExit('NewService marker not found')
          path.write_text(text.replace(marker, method, 1))

          Path('backend/internal/procurement/receiving_pdf.go').write_text(r'''package procurement

import (
	"fmt"
	"os"
	"strings"

	"github.com/signintech/gopdf"
)

const (
	receivingPDFWidth  = 842.0
	receivingPDFHeight = 595.0
)

type receivingPDFRow struct {
	Name        string
	InvoiceName string
	Pot         *float64
	Height      *float64
	Packages    *int
	Units       *int
	Quantity    int
	Price       int64
}

func receivingPDFRows(detail OrderDetail) ([]receivingPDFRow, error) {
	rows := make([]receivingPDFRow, 0, len(detail.Lines))
	for _, line := range detail.Lines {
		if line.InvoiceExcluded || line.ReconciliationStatus == "superseded" || line.ReconciliationStatus == "missing" {
			continue
		}
		if line.ReconciliationStatus == "added" && !line.ComparisonAccepted {
			continue
		}
		if line.MatchStatus != "confirmed" || line.InvoicedQuantity == nil || *line.InvoicedQuantity <= 0 || line.ProposedRetailRUB == nil || *line.ProposedRetailRUB <= 0 {
			return nil, &UserFacingError{Message: "PDF приёмки доступен только после сопоставления и расчёта всех позиций"}
		}
		name := strings.TrimSpace(line.SabyName)
		if name == "" {
			name = strings.TrimSpace(line.RawName)
		}
		rows = append(rows, receivingPDFRow{
			Name: name, InvoiceName: strings.TrimSpace(line.InvoiceRawName), Pot: line.PotDiameterCM, Height: line.HeightCM,
			Packages: line.PackageCount, Units: line.UnitsPerPackage, Quantity: *line.InvoicedQuantity, Price: *line.ProposedRetailRUB,
		})
	}
	if len(rows) == 0 {
		return nil, &UserFacingError{Message: "В закупке нет рассчитанных позиций для PDF приёмки"}
	}
	return rows, nil
}

func BuildReceivingPDF(detail OrderDetail) ([]byte, int, error) {
	rows, err := receivingPDFRows(detail)
	if err != nil {
		return nil, 0, err
	}
	fontPath := strings.TrimSpace(os.Getenv("PROCUREMENT_PDF_FONT"))
	if fontPath == "" {
		fontPath = "/app/fonts/DejaVuSans.ttf"
	}
	pdf := &gopdf.GoPdf{}
	pdf.Start(gopdf.Config{PageSize: gopdf.Rect{W: receivingPDFWidth, H: receivingPDFHeight}})
	if err := pdf.AddTTFFont("DejaVu", fontPath); err != nil {
		return nil, 0, fmt.Errorf("load receiving PDF font: %w", err)
	}

	const margin = 30.0
	widths := []float64{28, 320, 85, 90, 60, 95, 70}
	tableWidth := 0.0
	for _, width := range widths {
		tableWidth += width
	}
	page := 0
	y := 0.0
	addPage := func() error {
		page++
		pdf.AddPage()
		pdf.SetFillColor(30, 69, 53)
		pdf.RectFromUpperLeftWithStyle(margin, 24, tableWidth, 42, "F")
		pdf.SetTextColor(255, 255, 255)
		if err := pdf.SetFont("DejaVu", "", 17); err != nil { return err }
		pdf.SetXY(margin+14, 34)
		if err := pdf.Cell(nil, "Лист приёмки · Фикусин"); err != nil { return err }

		pdf.SetTextColor(45, 55, 49)
		if err := pdf.SetFont("DejaVu", "", 9); err != nil { return err }
		orderTitle := detail.Order.OrderNumber
		if strings.TrimSpace(orderTitle) == "" { orderTitle = fmt.Sprintf("№%d", detail.Order.ID) }
		meta := fmt.Sprintf("Закупка %s  ·  Инвойс %s  ·  %s  ·  %d позиций / %d шт.", orderTitle, blankDash(detail.Order.DocumentNumber), detail.Order.SupplierName, len(rows), receivingTotalUnits(rows))
		pdf.SetXY(margin, 76)
		if err := pdf.Cell(nil, meta); err != nil { return err }
		if detail.Order.DocumentDate != nil {
			pdf.SetXY(margin, 90)
			if err := pdf.Cell(nil, "Дата инвойса: "+detail.Order.DocumentDate.Format("02.01.2006")); err != nil { return err }
		}

		y = 112
		pdf.SetFillColor(238, 242, 239)
		pdf.SetStrokeColor(199, 207, 201)
		pdf.SetLineWidth(.45)
		pdf.RectFromUpperLeftWithStyle(margin, y, tableWidth, 24, "FD")
		if err := pdf.SetFont("DejaVu", "", 8.5); err != nil { return err }
		pdf.SetTextColor(45, 55, 49)
		headers := []string{"№", "Название СБИС", "Размер", "Упаковка", "Кол-во", "Цена, ₽", "Проверено"}
		x := margin
		for index, header := range headers {
			pdf.SetXY(x+4, y+7)
			if err := pdf.CellWithOption(&gopdf.Rect{W: widths[index]-8, H: 12}, header, gopdf.CellOption{Align: gopdf.Left}); err != nil { return err }
			x += widths[index]
		}
		y += 24
		return nil
	}
	if err := addPage(); err != nil { return nil, 0, err }

	for index, row := range rows {
		const rowHeight = 34.0
		if y+rowHeight > receivingPDFHeight-36 {
			pdf.SetTextColor(100, 105, 102)
			_ = pdf.SetFont("DejaVu", "", 8)
			pdf.SetXY(receivingPDFWidth-105, receivingPDFHeight-22)
			_ = pdf.Cell(nil, fmt.Sprintf("Страница %d", page))
			if err := addPage(); err != nil { return nil, 0, err }
		}
		if index%2 == 1 {
			pdf.SetFillColor(249, 250, 249)
			pdf.RectFromUpperLeftWithStyle(margin, y, tableWidth, rowHeight, "F")
		}
		pdf.SetStrokeColor(218, 223, 219)
		pdf.Line(margin, y+rowHeight, margin+tableWidth, y+rowHeight)
		x := margin
		values := []string{
			fmt.Sprintf("%d", index+1), shortenPDFText(row.Name, 58), sizePDFText(row), packagePDFText(row), fmt.Sprintf("%d", row.Quantity), formatPDFRUB(row.Price), "□",
		}
		for column, value := range values {
			pdf.SetTextColor(40, 48, 43)
			size := 9.0
			if column == 1 { size = 9.2 }
			if column == 6 { size = 15 }
			if err := pdf.SetFont("DejaVu", "", size); err != nil { return nil, 0, err }
			pdf.SetXY(x+4, y+7)
			if err := pdf.CellWithOption(&gopdf.Rect{W: widths[column]-8, H: 13}, value, gopdf.CellOption{Align: gopdf.Left}); err != nil { return nil, 0, err }
			if column == 1 && row.InvoiceName != "" && !strings.EqualFold(strings.TrimSpace(row.InvoiceName), strings.TrimSpace(row.Name)) {
				pdf.SetTextColor(112, 118, 114)
				if err := pdf.SetFont("DejaVu", "", 6.8); err != nil { return nil, 0, err }
				pdf.SetXY(x+4, y+21)
				if err := pdf.CellWithOption(&gopdf.Rect{W: widths[column]-8, H: 9}, "Инвойс: "+shortenPDFText(row.InvoiceName, 72), gopdf.CellOption{Align: gopdf.Left}); err != nil { return nil, 0, err }
			}
			x += widths[column]
		}
		y += rowHeight
	}
	pdf.SetTextColor(100, 105, 102)
	_ = pdf.SetFont("DejaVu", "", 8)
	pdf.SetXY(receivingPDFWidth-105, receivingPDFHeight-22)
	_ = pdf.Cell(nil, fmt.Sprintf("Страница %d", page))
	pdf.SetXY(margin, receivingPDFHeight-22)
	_ = pdf.Cell(nil, fmt.Sprintf("Итого: %d позиций · %d шт.", len(rows), receivingTotalUnits(rows)))

	content, err := pdf.GetBytesPdfReturnErr()
	if err != nil {
		return nil, 0, fmt.Errorf("render receiving PDF: %w", err)
	}
	return content, len(rows), nil
}

func receivingTotalUnits(rows []receivingPDFRow) int {
	total := 0
	for _, row := range rows { total += row.Quantity }
	return total
}

func blankDash(value string) string {
	if strings.TrimSpace(value) == "" { return "—" }
	return strings.TrimSpace(value)
}

func shortenPDFText(value string, limit int) string {
	runes := []rune(strings.TrimSpace(value))
	if len(runes) <= limit { return string(runes) }
	if limit < 2 { return string(runes[:limit]) }
	return string(runes[:limit-1])+"…"
}

func sizePDFText(row receivingPDFRow) string {
	parts := make([]string, 0, 2)
	if row.Pot != nil && *row.Pot > 0 { parts = append(parts, fmt.Sprintf("D%g", *row.Pot)) }
	if row.Height != nil && *row.Height > 0 { parts = append(parts, fmt.Sprintf("H%g см", *row.Height)) }
	if len(parts) == 0 { return "—" }
	return strings.Join(parts, " · ")
}

func packagePDFText(row receivingPDFRow) string {
	if row.Units == nil || row.Packages == nil || *row.Units <= 0 || *row.Packages <= 0 { return "—" }
	return fmt.Sprintf("%d × %d", *row.Units, *row.Packages)
}

func formatPDFRUB(value int64) string {
	return fmt.Sprintf("%d ₽", value)
}
