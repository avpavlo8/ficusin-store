name: Check Telegram bot secret

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/telegram-secret-check.yml"

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check bot access without exposing the token
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          context = "telegram/secret-missing"
          state = "failure"
          if token:
              try:
                  request = urllib.request.Request(
                      "https://api.telegram.org/bot" + token + "/getMe",
                      headers={"User-Agent": "Ficusin-Orders/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      result = json.load(response)
                  if result.get("ok"):
                      context = "telegram/bot-access-ok"
                      state = "success"
                  else:
                      context = "telegram/bot-access-rejected"
              except Exception:
                  context = "telegram/bot-access-error"

          status_request = urllib.request.Request(
              "https://api.github.com/repos/"
              + os.environ["GITHUB_REPOSITORY"]
              + "/statuses/"
              + os.environ["GITHUB_SHA"],
              data=json.dumps({
                  "state": state,
                  "description": "Telegram bot configuration check",
                  "context": context,
              }).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(status_request, timeout=20):
              pass
          if state != "success":
              raise SystemExit("Telegram bot configuration is unavailable")
          PY
