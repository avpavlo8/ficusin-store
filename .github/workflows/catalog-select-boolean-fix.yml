name: finalize catalog boolean select

on:
  push:
    branches:
      - fix/public-catalog-final-audit
    paths-ignore:
      - .github/workflows/catalog-select-boolean-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Patch boolean select labels
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("frontend/src/StorefrontPage.tsx")
          s = p.read_text()
          old = '{isBoolean ? (value === "true" ? "Да" : "Нет") : attributeLabel(value)}'
          new = '{isBoolean ? (value === "true" ? "Есть" : "Нет") : facet.labels.get(value) || attributeLabel(value)}'
          if old not in s:
              raise SystemExit("boolean select fragment not found")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove runner
        run: |
          rm .github/workflows/catalog-select-boolean-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/StorefrontPage.tsx .github/workflows/catalog-select-boolean-fix.yml
          git commit -m "fix: use public labels for boolean selects"
          git push origin HEAD:${{ github.ref_name }}
