name: One-off Saby pagination repair

on:
  push:
    branches:
      - fix/saby-catalog-outcome-pagination

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Patch Saby catalogue pagination
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/internal/integration/saby_procurement.go')
          text = path.read_text()

          old_struct = '''type sabyCatalogPage struct {
          \tNomenclatures sabyCatalogRows `json:"nomenclatures"`
          \tItems         sabyCatalogRows `json:"items"`
          \tResult        sabyCatalogRows `json:"result"`
          }
          '''
          new_struct = '''type sabyCatalogPage struct {
          \tNomenclatures sabyCatalogRows `json:"nomenclatures"`
          \tItems         sabyCatalogRows `json:"items"`
          \tResult        sabyCatalogRows `json:"result"`
          \tOutcome       *bool            `json:"outcome"`
          }
          '''
          if old_struct not in text:
              raise SystemExit('sabyCatalogPage struct pattern not found')
          text = text.replace(old_struct, new_struct, 1)

          old_start = '''\trows := make([]map[string]any, 0)
          \tseenRows := make(map[string]bool)
          \tfor pageNumber := 0; pageNumber < 200; pageNumber++ {
          '''
          new_start = '''\trows := make([]map[string]any, 0)
          \tseenRows := make(map[string]bool)
          \tnoProgressPages := 0
          \tfor pageNumber := 0; pageNumber < 200; pageNumber++ {
          '''
          if old_start not in text:
              raise SystemExit('pagination loop start pattern not found')
          text = text.replace(old_start, new_start, 1)

          old_page = '''\t\tpageRows := page.rows()
          \t\t// Saby can repeat rows on adjacent pages while still having newer cards
          \t\t// on later pages. Stop only when the API returns an actually empty page;
          \t\t// using "no fresh IDs" as EOF silently truncated recently created goods.
          \t\tif len(pageRows) == 0 {
          \t\t\tbreak
          \t\t}
          \t\tfor _, item := range pageRows {
          \t\t\tkey := sabyValue(item["hierarchicalId"])
          \t\t\tif key == "" {
          \t\t\t\tkey = sabyValue(item["id"])
          \t\t\t}
          \t\t\tif key == "" || seenRows[key] {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\tseenRows[key] = true
          \t\t\titem["sectionPath"] = append([]string(nil), sectionPath...)
          \t\t\trows = append(rows, item)
          \t\t}
          \t\tif pageNumber == 199 {
          \t\t\treturn nil, errors.New("превышен предел страниц каталога")
          \t\t}
          '''
          new_page = '''\t\tpageRows := page.rows()
          \t\tif len(pageRows) == 0 {
          \t\t\tbreak
          \t\t}
          \t\tfreshRows := 0
          \t\tfor _, item := range pageRows {
          \t\t\tkey := sabyValue(item["hierarchicalId"])
          \t\t\tif key == "" {
          \t\t\t\tkey = sabyValue(item["id"])
          \t\t\t}
          \t\t\tif key == "" || seenRows[key] {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\tseenRows[key] = true
          \t\t\tfreshRows++
          \t\t\titem["sectionPath"] = append([]string(nil), sectionPath...)
          \t\t\trows = append(rows, item)
          \t\t}
          \t\t// The documented Saby Retail response exposes `outcome` as the
          \t\t// authoritative "has more" flag. Some tenants keep returning the
          \t\t// last non-empty page for page numbers beyond EOF, so waiting for an
          \t\t// empty page can loop until our hard 200-page guard. Trust outcome
          \t\t// when it is present. Older/alternate response shapes omit it; for
          \t\t// those, tolerate several duplicate-only pages so a transient repeat
          \t\t// (the PR #390 regression) cannot truncate newer cards on a later page.
          \t\tif page.Outcome != nil {
          \t\t\tif !*page.Outcome {
          \t\t\t\tbreak
          \t\t\t}
          \t\t\tnoProgressPages = 0
          \t\t} else if freshRows == 0 {
          \t\t\tnoProgressPages++
          \t\t\tif noProgressPages >= 5 {
          \t\t\t\tbreak
          \t\t\t}
          \t\t} else {
          \t\t\tnoProgressPages = 0
          \t\t}
          \t\tif pageNumber == 199 {
          \t\t\treturn nil, errors.New("превышен предел страниц каталога")
          \t\t}
          '''
          if old_page not in text:
              raise SystemExit('pagination body pattern not found')
          text = text.replace(old_page, new_page, 1)
          path.write_text(text)

          test_path = Path('backend/internal/integration/saby_catalog_pagination_outcome_test.go')
          test_path.write_text(r'''package integration

          import (
          	"context"
          	"net/http"
          	"net/http/httptest"
          	"net/url"
          	"strconv"
          	"testing"
          )

          func TestSabyCatalogPaginationUsesOutcomeAsEOF(t *testing.T) {
          	var catalogueCalls int
          	server := httptest.NewServer(http.HandlerFunc(func(response http.ResponseWriter, request *http.Request) {
          		response.Header().Set("Content-Type", "application/json")
          		if request.URL.Path == "/oauth/service/" {
          			_, _ = response.Write([]byte(`{"token":"safe-token"}`))
          			return
          		}
          		catalogueCalls++
          		if request.URL.Query().Get("page") != "0" {
          			t.Errorf("unexpected page after outcome=false: %s", request.URL.Query().Get("page"))
          		}
          		_, _ = response.Write([]byte(`{"nomenclatures":[{"id":"101","name":"Anthurium Beauty Black"}],"outcome":false}`))
          	}))
          	defer server.Close()

          	client := NewSabyClient("client", "secret", "service", 278, 6)
          	client.authURL, client.apiBase, client.client = server.URL+"/oauth/service/", server.URL, server.Client()
          	rows, err := client.fetchCatalogSection(context.Background(), url.Values{"pointId": {"278"}, "pageSize": {"1000"}}, "", map[string]bool{}, 0, nil)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if len(rows) != 1 || catalogueCalls != 1 {
          		t.Fatalf("rows=%d calls=%d, want one page", len(rows), catalogueCalls)
          	}
          }

          func TestSabyCatalogPaginationOutcomeKeepsDuplicateBridgePage(t *testing.T) {
          	var catalogueCalls int
          	server := httptest.NewServer(http.HandlerFunc(func(response http.ResponseWriter, request *http.Request) {
          		response.Header().Set("Content-Type", "application/json")
          		if request.URL.Path == "/oauth/service/" {
          			_, _ = response.Write([]byte(`{"token":"safe-token"}`))
          			return
          		}
          		catalogueCalls++
          		page, _ := strconv.Atoi(request.URL.Query().Get("page"))
          		switch page {
          		case 0:
          			_, _ = response.Write([]byte(`{"nomenclatures":[{"id":"101","name":"Anthurium Beauty Black"}],"outcome":true}`))
          		case 1:
          			_, _ = response.Write([]byte(`{"nomenclatures":[{"id":"101","name":"Anthurium Beauty Black"}],"outcome":true}`))
          		case 2:
          			_, _ = response.Write([]byte(`{"nomenclatures":[{"id":"102","name":"Anthurium Black Love"},{"id":"103","name":"Anthurium Melodia Ibis"}],"outcome":false}`))
          		default:
          			t.Errorf("unexpected page %d", page)
          			_, _ = response.Write([]byte(`{"nomenclatures":[],"outcome":false}`))
          		}
          	}))
          	defer server.Close()

          	client := NewSabyClient("client", "secret", "service", 278, 6)
          	client.authURL, client.apiBase, client.client = server.URL+"/oauth/service/", server.URL, server.Client()
          	rows, err := client.fetchCatalogSection(context.Background(), url.Values{"pointId": {"278"}, "pageSize": {"1000"}}, "", map[string]bool{}, 0, nil)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if len(rows) != 3 || catalogueCalls != 3 {
          		t.Fatalf("rows=%d calls=%d, want three rows across three pages", len(rows), catalogueCalls)
          	}
          }

          func TestSabyCatalogPaginationStopsAfterRepeatedNoProgressWithoutOutcome(t *testing.T) {
          	var catalogueCalls int
          	server := httptest.NewServer(http.HandlerFunc(func(response http.ResponseWriter, request *http.Request) {
          		response.Header().Set("Content-Type", "application/json")
          		if request.URL.Path == "/oauth/service/" {
          			_, _ = response.Write([]byte(`{"token":"safe-token"}`))
          			return
          		}
          		catalogueCalls++
          		_, _ = response.Write([]byte(`{"nomenclatures":[{"id":"101","name":"Anthurium Beauty Black"}]}`))
          	}))
          	defer server.Close()

          	client := NewSabyClient("client", "secret", "service", 278, 6)
          	client.authURL, client.apiBase, client.client = server.URL+"/oauth/service/", server.URL, server.Client()
          	rows, err := client.fetchCatalogSection(context.Background(), url.Values{"pointId": {"278"}, "pageSize": {"1000"}}, "", map[string]bool{}, 0, nil)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if len(rows) != 1 || catalogueCalls != 6 {
          		t.Fatalf("rows=%d calls=%d, want one row and bounded fallback pagination", len(rows), catalogueCalls)
          	}
          }
          ''')
          PY
      - name: Format and test
        shell: bash
        run: |
          cd backend
          gofmt -w internal/integration/saby_procurement.go internal/integration/saby_catalog_pagination_outcome_test.go
          go test ./internal/integration ./internal/saby
          go vet ./...
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/internal/integration/saby_procurement.go backend/internal/integration/saby_catalog_pagination_outcome_test.go
          git commit -m "fix(saby): honor catalogue pagination outcome"
          git push
