name: Production monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  critical-reads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify runtime, database, catalogue and guest cart
        id: critical_reads
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          curl --fail --silent --show-error --max-time 10 https://ficusin.ru/api/v1/health >"$work/health.json"
          curl --fail --silent --show-error --max-time 10 https://ficusin.ru/api/v1/ready >"$work/ready.json"
          curl --fail --silent --show-error --max-time 20 https://ficusin.ru/api/v1/catalog >"$work/catalog.json"
          curl --fail --silent --show-error --max-time 10 --cookie-jar "$work/cookies" https://ficusin.ru/api/v1/cart >"$work/cart.json"

          python3 - "$work" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          health = json.loads((root / "health.json").read_text())
          ready = json.loads((root / "ready.json").read_text())
          catalog = json.loads((root / "catalog.json").read_text())
          cart = json.loads((root / "cart.json").read_text())
          assert health.get("status") == "ok" and health.get("version"), health
          assert ready.get("status") == "ok", ready
          assert isinstance(catalog.get("products"), list) and catalog["products"], "catalog is empty"
          assert isinstance(cart.get("items"), dict), cart
          assert isinstance(cart.get("lines"), list), cart
          print(f"version={health['version']} products={len(catalog['products'])}")
          PY
      - name: Open or update the production incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title='[Sev-1] Production critical reads are failing'
          issue="$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "[Sev-1] Production critical reads are failing") | .number' | head -1)"
          body="$(printf '%s\n\n%s\n%s\n%s\n\n%s' \
            'The scheduled external monitor could not verify runtime, database, catalogue and guest cart.' \
            "Run: ${RUN_URL}" "Commit: ${GITHUB_SHA}" "Detected: $(date -u +%FT%TZ)" \
            'Treat this as customer-impacting until the failed request is identified and the commerce queues are reconciled.')"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Close the incident after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          issue="$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "[Sev-1] Production critical reads are failing") | .number' | head -1)"
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "External checks recovered at $(date -u +%FT%TZ). Verification: ${RUN_URL}"
          fi
