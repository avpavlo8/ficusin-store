name: Update procurement acceptance wording
on:
  push:
    branches: [fix/procurement-pdf-and-price-display]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/procurement-pdf-and-price-display
      - name: Update acceptance assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('e2e/verify-crm-acceptance.mjs')
          s = p.read_text()
          old = "Текущая: 945 ₽ · оценочная"
          new = "Учётная себестоимость: 945 ₽ · оценочная"
          if old not in s:
              raise SystemExit('old acceptance text not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit assertion update
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add e2e/verify-crm-acceptance.mjs
          git commit -m 'test(procurement): update cost label acceptance'
          git push origin HEAD:fix/procurement-pdf-and-price-display
