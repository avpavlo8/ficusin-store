name: Apply late procurement alias reconciliation fix

on:
  push:
    branches:
      - fix/procurement-late-alias-collapse

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ficusin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ficusin_test?sslmode=disable
      CRM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ficusin_test?sslmode=disable
      DATABASE_SSL_VERIFY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/procurement-late-alias-collapse
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - name: Patch late alias reconciliation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/internal/procurement/postgres_catalogue.go')
          text = path.read_text()
          if 'func reconcileLateAliasMatches(' in text:
              raise SystemExit('late alias helper already exists')

          call_anchor = '\t// A prepared document contains a snapshot of the old Saby IDs and balances.\n'
          call = '''\tif input.MatchStatus == "confirmed" {
\t\torderIDs, err := reconcileLateAliasMatches(ctx, tx, aliasID, input.SabyID)
\t\tif err != nil {
\t\t\treturn AliasReview{}, fmt.Errorf("reconcile procurement lines after late alias match: %w", err)
\t\t}
\t\tfor _, orderID := range orderIDs {
\t\t\tif err := releaseOrderAllocations(ctx, tx, orderID, "late_alias_reconcile"); err != nil {
\t\t\t\treturn AliasReview{}, fmt.Errorf("release allocations after late alias match: %w", err)
\t\t\t}
\t\t\tif err := rebalanceInvoiceAllocations(ctx, tx, orderID); err != nil {
\t\t\t\treturn AliasReview{}, fmt.Errorf("rebalance allocations after late alias match: %w", err)
\t\t\t}
\t\t}
\t}

'''
          if call_anchor not in text:
              raise SystemExit('ResolveAlias insertion anchor not found')
          text = text.replace(call_anchor, call + call_anchor, 1)

          helper_anchor = '\nfunc (store *PostgresStore) UpdateOrderLine('
          helper = r'''
func reconcileLateAliasMatches(ctx context.Context, tx pgx.Tx, aliasID int64, sabyID string) ([]int64, error) {
	rows, err := tx.Query(ctx, `
		WITH unique_added AS (
			SELECT line.procurement_order_id,line.saby_id,MIN(line.id) AS added_id
			FROM procurement_order_lines line
			JOIN procurement_supplier_aliases alias ON alias.id=line.supplier_alias_id
			WHERE line.supplier_alias_id=$1 AND line.saby_id=$2
				AND alias.match_status='confirmed' AND alias.matched_saby_id=line.saby_id
				AND line.procurement_document_id IS NOT NULL
				AND line.reconciliation_status='added' AND line.match_status='confirmed'
				AND NOT line.invoice_excluded
			GROUP BY line.procurement_order_id,line.saby_id
			HAVING COUNT(*)=1
		), unique_missing AS (
			SELECT procurement_order_id,saby_id,MIN(id) AS planned_id
			FROM procurement_order_lines
			WHERE saby_id=$2 AND procurement_document_id IS NULL
				AND ordered_qty>0 AND reconciliation_status='missing'
			GROUP BY procurement_order_id,saby_id
			HAVING COUNT(*)=1
		), pairs AS (
			SELECT added.procurement_order_id,added.added_id,missing.planned_id
			FROM unique_added added
			JOIN unique_missing missing USING(procurement_order_id,saby_id)
			JOIN procurement_orders orders ON orders.id=added.procurement_order_id
			WHERE orders.status NOT IN ('received','cancelled')
		), merged AS (
			UPDATE procurement_order_lines planned SET
				procurement_document_id=invoice.procurement_document_id,
				supplier_alias_id=invoice.supplier_alias_id,
				canonical_variant_id=COALESCE(invoice.canonical_variant_id,planned.canonical_variant_id),
				invoice_raw_name=invoice.invoice_raw_name,
				invoice_supplier_article=invoice.invoice_supplier_article,
				invoiced_qty=invoice.invoiced_qty,unit_price=invoice.unit_price,line_total=invoice.line_total,
				match_status=invoice.match_status,source_page=invoice.source_page,source_line=invoice.source_line,
				comparison_accepted=FALSE,comparison_note='',
				reconciliation_status=CASE WHEN planned.ordered_qty IS DISTINCT FROM invoice.invoiced_qty
					OR (planned.expected_unit_price IS NOT NULL AND
						(invoice.unit_price IS NULL OR ABS(planned.expected_unit_price-invoice.unit_price)>.005))
					THEN 'changed' ELSE 'matched' END,
				updated_at=CURRENT_TIMESTAMP
			FROM pairs JOIN procurement_order_lines invoice ON invoice.id=pairs.added_id
			WHERE planned.id=pairs.planned_id
			RETURNING planned.procurement_order_id,pairs.added_id
		)
		UPDATE procurement_order_lines stale SET reconciliation_status='superseded',updated_at=CURRENT_TIMESTAMP
		FROM merged WHERE stale.id=merged.added_id
		RETURNING merged.procurement_order_id
	`, aliasID, sabyID)
	if err != nil {
		return nil, err
	}
	defer rows.Close()
	seen := map[int64]struct{}{}
	orderIDs := make([]int64, 0)
	for rows.Next() {
		var orderID int64
		if err := rows.Scan(&orderID); err != nil {
			return nil, err
		}
		if _, ok := seen[orderID]; ok {
			continue
		}
		seen[orderID] = struct{}{}
		orderIDs = append(orderIDs, orderID)
	}
	if err := rows.Err(); err != nil {
		return nil, err
	}
	return orderIDs, nil
}
'''
          if helper_anchor not in text:
              raise SystemExit('UpdateOrderLine anchor not found')
          text = text.replace(helper_anchor, '\n' + helper + helper_anchor, 1)
          path.write_text(text)
          PY
          gofmt -w backend/internal/procurement/postgres_catalogue.go

      - name: Add repair migration and regression test
        run: |
          cat > timeweb/migrations/20260916_procurement_late_alias_reconciliation.sql <<'EOF'
          -- When an invoice line was initially unknown, it was stored as an
          -- added supplier line while the buyer's planned line became missing.
          -- If the manager later maps that supplier alias to the same Saby item,
          -- collapse the unique pair back into the immutable buyer plan.
          WITH unique_added AS (
            SELECT line.procurement_order_id,line.saby_id,MIN(line.id) AS added_id
            FROM procurement_order_lines line
            JOIN procurement_supplier_aliases alias ON alias.id=line.supplier_alias_id
            JOIN procurement_orders orders ON orders.id=line.procurement_order_id
            WHERE line.saby_id IS NOT NULL
              AND alias.match_status='confirmed' AND alias.matched_saby_id=line.saby_id
              AND line.procurement_document_id IS NOT NULL
              AND line.reconciliation_status='added' AND line.match_status='confirmed'
              AND NOT line.invoice_excluded
              AND orders.status NOT IN ('received','cancelled')
            GROUP BY line.procurement_order_id,line.saby_id
            HAVING COUNT(*)=1
          ), unique_missing AS (
            SELECT line.procurement_order_id,line.saby_id,MIN(line.id) AS planned_id
            FROM procurement_order_lines line
            JOIN procurement_orders orders ON orders.id=line.procurement_order_id
            WHERE line.saby_id IS NOT NULL AND line.procurement_document_id IS NULL
              AND line.ordered_qty>0 AND line.reconciliation_status='missing'
              AND orders.status NOT IN ('received','cancelled')
            GROUP BY line.procurement_order_id,line.saby_id
            HAVING COUNT(*)=1
          ), pairs AS (
            SELECT added.procurement_order_id,added.added_id,missing.planned_id
            FROM unique_added added
            JOIN unique_missing missing USING(procurement_order_id,saby_id)
          ), merged AS (
            UPDATE procurement_order_lines planned SET
              procurement_document_id=invoice.procurement_document_id,
              supplier_alias_id=invoice.supplier_alias_id,
              canonical_variant_id=COALESCE(invoice.canonical_variant_id,planned.canonical_variant_id),
              invoice_raw_name=invoice.invoice_raw_name,
              invoice_supplier_article=invoice.invoice_supplier_article,
              invoiced_qty=invoice.invoiced_qty,unit_price=invoice.unit_price,line_total=invoice.line_total,
              match_status=invoice.match_status,source_page=invoice.source_page,source_line=invoice.source_line,
              comparison_accepted=FALSE,comparison_note='',
              reconciliation_status=CASE WHEN planned.ordered_qty IS DISTINCT FROM invoice.invoiced_qty
                OR (planned.expected_unit_price IS NOT NULL AND
                  (invoice.unit_price IS NULL OR ABS(planned.expected_unit_price-invoice.unit_price)>.005))
                THEN 'changed' ELSE 'matched' END,
              updated_at=CURRENT_TIMESTAMP
            FROM pairs JOIN procurement_order_lines invoice ON invoice.id=pairs.added_id
            WHERE planned.id=pairs.planned_id
            RETURNING planned.procurement_order_id,pairs.added_id
          )
          UPDATE procurement_order_lines stale SET reconciliation_status='superseded',updated_at=CURRENT_TIMESTAMP
          FROM merged WHERE stale.id=merged.added_id;
          EOF

          cat > backend/internal/procurement/late_alias_reconciliation_live_test.go <<'EOF'
          package procurement

          import (
          	"context"
          	"fmt"
          	"os"
          	"testing"
          	"time"

          	"github.com/jackc/pgx/v5/pgxpool"
          )

          func TestResolveAliasCollapsesLateInvoiceLineOnLiveDatabase(t *testing.T) {
          	dsn := os.Getenv("CRM_TEST_DATABASE_URL")
          	if dsn == "" {
          		t.Skip("CRM_TEST_DATABASE_URL is not set")
          	}
          	ctx := context.Background()
          	pool, err := pgxpool.New(ctx, dsn)
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer pool.Close()
          	store := NewPostgresStore(pool)
          	unique := time.Now().UnixNano()
          	sabyID := fmt.Sprintf("late-fittonia-%d", unique)
          	if _, err = pool.Exec(ctx, `INSERT INTO saby_nomenclature(saby_id,code,name,balance,section_path,seen_at)
          		VALUES($1,$1,'Фиттония D9',0,ARRAY['Цветы'],CURRENT_TIMESTAMP)`, sabyID); err != nil {
          		t.Fatal(err)
          	}
          	var actorID int64
          	if err = pool.QueryRow(ctx, `INSERT INTO customers(email,phone,password_hash,full_name,consent_at)
          		VALUES($1,$2,'','Late alias owner',CURRENT_TIMESTAMP) RETURNING id`, fmt.Sprintf("late-alias-%d@example.invalid", unique), fmt.Sprintf("+78%09d", unique%1000000000)).Scan(&actorID); err != nil {
          		t.Fatal(err)
          	}
          	var supplierID int64
          	if err = pool.QueryRow(ctx, `INSERT INTO procurement_suppliers(name,kind,country_code,default_currency)
          		VALUES($1,'international','NL','EUR') RETURNING id`, fmt.Sprintf("Late alias supplier %d", unique)).Scan(&supplierID); err != nil {
          		t.Fatal(err)
          	}
          	var orderID, plannedID int64
          	if err = pool.QueryRow(ctx, `INSERT INTO procurement_orders(supplier_id,order_number,source_kind,currency,status,created_by)
          		VALUES($1,$2,'recommendation','EUR','ordered',$3) RETURNING id`, supplierID, fmt.Sprintf("LATE-%d", unique), actorID).Scan(&orderID); err != nil {
          		t.Fatal(err)
          	}
          	if err = pool.QueryRow(ctx, `INSERT INTO procurement_order_lines(procurement_order_id,saby_id,raw_name,ordered_qty,
          		expected_unit_price,load_unit,pot_diameter_cm,height_cm,match_status,reconciliation_status)
          		VALUES($1,$2,'Фиттония D9',21,4.00,'shelf',8.5,12.5,'confirmed','planned') RETURNING id`, orderID, sabyID).Scan(&plannedID); err != nil {
          		t.Fatal(err)
          	}

          	parsed := ParsedDocument{ParserKind: "holland_packing_list", DocumentNumber: fmt.Sprintf("INV-LATE-%d", unique), Currency: "EUR", ArithmeticOK: true,
          		ProductSubtotal: 84, DocumentTotal: 84, CalculatedTotal: 84, Lines: []ParsedLine{{SourcePage: 1, SourceLine: 1, RawName: "Fitt Gem 3 Kl", Quantity: 21, UnitPrice: 4, LineTotal: 84, LoadUnit: "shelf"}}}
          	if _, err = store.ImportDocument(ctx, Actor{CustomerID: actorID, Role: "owner"}, DocumentUpload{SupplierID: supplierID, OrderID: orderID,
          		FileName: "fittonia.pdf", ContentType: "application/pdf", Content: []byte(fmt.Sprintf("%%PDF-late-alias-%d", unique))}, parsed); err != nil {
          		t.Fatal(err)
          	}

          	var aliasID, addedID int64
          	if err = pool.QueryRow(ctx, `SELECT id FROM procurement_supplier_aliases WHERE supplier_id=$1 AND raw_name='Fitt Gem 3 Kl' ORDER BY id DESC LIMIT 1`, supplierID).Scan(&aliasID); err != nil {
          		t.Fatal(err)
          	}
          	if err = pool.QueryRow(ctx, `SELECT id FROM procurement_order_lines WHERE procurement_order_id=$1 AND reconciliation_status='added'`, orderID).Scan(&addedID); err != nil {
          		t.Fatal(err)
          	}
          	var status string
          	if err = pool.QueryRow(ctx, `SELECT reconciliation_status FROM procurement_order_lines WHERE id=$1`, plannedID).Scan(&status); err != nil || status != "missing" {
          		t.Fatalf("planned line before mapping status=%q err=%v", status, err)
          	}

          	if _, err = store.ResolveAlias(ctx, Actor{CustomerID: actorID, Role: "owner"}, aliasID, AliasResolution{MatchStatus: "confirmed", SabyID: sabyID}); err != nil {
          		t.Fatal(err)
          	}

          	var activeLines, invoiced int
          	var invoiceName string
          	var hasDocument bool
          	if err = pool.QueryRow(ctx, `SELECT COUNT(*)::INTEGER FROM procurement_order_lines WHERE procurement_order_id=$1 AND reconciliation_status<>'superseded'`, orderID).Scan(&activeLines); err != nil {
          		t.Fatal(err)
          	}
          	if activeLines != 1 {
          		t.Fatalf("visible lines=%d, want 1", activeLines)
          	}
          	if err = pool.QueryRow(ctx, `SELECT reconciliation_status,procurement_document_id IS NOT NULL,invoice_raw_name,invoiced_qty
          		FROM procurement_order_lines WHERE id=$1`, plannedID).Scan(&status, &hasDocument, &invoiceName, &invoiced); err != nil {
          		t.Fatal(err)
          	}
          	if status != "matched" || !hasDocument || invoiceName != "Fitt Gem 3 Kl" || invoiced != 21 {
          		t.Fatalf("collapsed plan status=%q document=%v invoice=%q qty=%d", status, hasDocument, invoiceName, invoiced)
          	}
          	if err = pool.QueryRow(ctx, `SELECT reconciliation_status FROM procurement_order_lines WHERE id=$1`, addedID).Scan(&status); err != nil || status != "superseded" {
          		t.Fatalf("supplier duplicate status=%q err=%v", status, err)
          	}
          }
          EOF
          gofmt -w backend/internal/procurement/late_alias_reconciliation_live_test.go

      - name: Apply migrations
        run: |
          for file in timeweb/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
      - name: Test backend
        working-directory: backend
        run: |
          go test ./internal/procurement -run TestResolveAliasCollapsesLateInvoiceLineOnLiveDatabase -count=1
          go test ./...
          go vet ./...
          go build ./cmd/api
      - name: Commit fix and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/oneoff-late-alias-reconcile.yml
          git add backend/internal/procurement/postgres_catalogue.go backend/internal/procurement/late_alias_reconciliation_live_test.go timeweb/migrations/20260916_procurement_late_alias_reconciliation.sql .github/workflows/oneoff-late-alias-reconcile.yml
          git commit -m "fix(procurement): collapse late-matched invoice lines"
          git push origin HEAD:fix/procurement-late-alias-collapse
