name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  catalog-rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Apply one-shot catalogue patches
        shell: bash
        run: |
          changed=0
          if [ -f scripts/catalog_model_rewrite.py ]; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/catalog_model_rewrite.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('quantity: number }>;\n",', 'quantity: number }>;\\n",')
          path.write_text(text, encoding='utf-8')
          PY
            python3 scripts/catalog_model_rewrite.py
            changed=1
          fi
          for helper in scripts/catalog_*followup.py; do
            if [ -f "$helper" ]; then
              python3 "$helper"
              changed=1
            fi
          done
          git diff --check
          if [ "$changed" = "0" ] || git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: apply catalogue v2 PIM model"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  frontend:
    needs: catalog-rewrite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  layout:
    needs: catalog-rewrite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm install
        working-directory: e2e
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}
      - run: npx playwright install --with-deps chromium webkit
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: e2e
      - run: npx playwright install-deps chromium webkit
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  backend:
    needs: catalog-rewrite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/api

  saby-sync-tests:
    needs: catalog-rewrite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  image:
    if: github.ref == 'refs/heads/main'
    needs: catalog-rewrite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
