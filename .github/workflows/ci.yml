name: Verify

# Раньше стояло просто "push" и "pull_request" без условий: каждый коммит в
# ветку запускал сборку дважды, и половина минут уходила на дубликаты. Ветки
# проверяются через pull request, main — при вливании.
on:
  push:
    branches: [main]
  pull_request:

# Пока правишь замечания, коммиты идут один за другим. Старые прогоны больше
# не досиживают до конца впустую — новый отменяет предыдущий.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Guards the phone layout: it broke once without anyone noticing, because
  # nothing here ever looked at the site at a phone's width.
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm install
        working-directory: e2e
      # Браузеры весят сотни мегабайт и раньше качались заново каждый раз —
      # однажды это растянулось на двадцать шесть минут. Теперь они лежат в
      # кэше, а с нуля ставятся только когда меняется сам Playwright.
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}
      - run: npx playwright install --with-deps chromium webkit
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: e2e
      # Системные библиотеки в кэш не попадают, их всё равно нужно доставить.
      - run: npx playwright install-deps chromium webkit
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/api

  # Production запускает миграции до HTTP-сервера. Раньше CI проверял только
  # текстовые контракты, поэтому синтаксические/зависимые ошибки 055/056
  # обнаруживались уже в Timeweb. Здесь применяем весь каталог миграций к
  # настоящему PostgreSQL в том же лексикографическом порядке и транзакционно.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ficusin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ficusin_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply every production migration
        run: |
          set -euo pipefail
          for migration in $(find timeweb/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "::group::${migration}"
            psql \
              -h 127.0.0.1 \
              -U postgres \
              -d ficusin_ci \
              -v ON_ERROR_STOP=1 \
              --single-transaction \
              -f "${migration}"
            echo "::endgroup::"
          done

  saby-sync-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  # Dockerfile — часть production-кода. Кроме сборки запускаем именно финальный
  # image с PostgreSQL и ждём его Docker HEALTHCHECK. Это ловит ошибки startup,
  # миграций, прав пользователя и runtime-инструментов до Timeweb.
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ficusin_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ficusin_runtime"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ficusin-ci:verify
      - name: Verify runtime tools
        run: |
          docker run --rm --entrypoint pdftotext ficusin-ci:verify -v
          docker run --rm --entrypoint wget ficusin-ci:verify --help >/dev/null
      - name: Boot production image and wait for health
        run: |
          set -euo pipefail
          docker run -d \
            --name ficusin-runtime \
            --network host \
            -e DATABASE_URL='postgres://postgres:postgres@127.0.0.1:5432/ficusin_runtime?sslmode=disable' \
            -e DATABASE_SSL_VERIFY=false \
            -e TELEGRAM_BOT_TOKEN=ci-dummy-token \
            -e TELEGRAM_ORDER_CHAT_ID=-100000000001 \
            -e AUTH_COOKIE_SECURE=false \
            ficusin-ci:verify

          cleanup() {
            docker logs ficusin-runtime 2>&1 || true
            docker rm -f ficusin-runtime >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            state="$(docker inspect -f '{{.State.Status}}' ficusin-runtime)"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' ficusin-runtime)"
            echo "attempt=${attempt} state=${state} health=${health}"
            if [[ "$health" == "healthy" ]]; then
              curl -fsS http://127.0.0.1:3000/api/v1/health | grep -q '"status":"ok"'
              exit 0
            fi
            if [[ "$state" == "exited" || "$state" == "dead" ]]; then
              echo 'Production container exited before becoming healthy.' >&2
              exit 1
            fi
            sleep 5
          done

          echo 'Production container did not become healthy in time.' >&2
          exit 1
