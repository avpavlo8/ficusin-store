name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm install
        working-directory: e2e
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}
      - run: npx playwright install --with-deps chromium webkit
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: e2e
      - run: npx playwright install-deps chromium webkit
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/api

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ficusin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ficusin_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply every production migration with historical orphan fixture
        run: |
          set -euo pipefail
          for migration in $(find timeweb/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            if [[ "$(basename "$migration")" == "055_catalog_spu_sku_attributes.sql" ]]; then
              echo 'Seeding an order line whose original catalogue product no longer exists.'
              psql -h 127.0.0.1 -U postgres -d ficusin_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO orders(
            order_number, customer_name, phone, email, address, comment,
            delivery_method, delivery_fee, subtotal, total
          ) VALUES (
            'CI-ORPHAN-ORDER', 'Migration test', '+70000000000', 'ci@example.invalid', '', '',
            'pickup', 0, 642, 642
          );
          INSERT INTO order_items(order_id, product_id, product_name, unit_price, quantity)
          SELECT id, 'deleted-product-from-history', 'CI orphan order item', 321, 2
          FROM orders WHERE order_number='CI-ORPHAN-ORDER';
          SQL
            fi

            echo "::group::${migration}"
            psql \
              -h 127.0.0.1 \
              -U postgres \
              -d ficusin_ci \
              -v ON_ERROR_STOP=1 \
              --single-transaction \
              -f "${migration}"
            echo "::endgroup::"
          done

          orphan_preserved="$(psql -h 127.0.0.1 -U postgres -d ficusin_ci -Atc \
            "SELECT COUNT(*) FROM order_items WHERE product_name='CI orphan order item' AND unit_price=321 AND quantity=2 AND legacy_product_ref='deleted-product-from-history' AND product_id IS NULL AND variant_id IS NULL AND sku IS NULL")"
          if [[ "$orphan_preserved" != "1" ]]; then
            echo "Expected one preserved legacy order line, got ${orphan_preserved}." >&2
            exit 1
          fi

          archive_products="$(psql -h 127.0.0.1 -U postgres -d ficusin_ci -Atc \
            "SELECT COUNT(*) FROM products WHERE short_description='Архивная карточка для сохранения истории заказа'")"
          if [[ "$archive_products" != "0" ]]; then
            echo "Migration must not fabricate catalogue products for history; found ${archive_products}." >&2
            exit 1
          fi

          # A normal new row has no legacy_product_ref and therefore must carry
          # the full catalogue identity. This insert must be rejected by CHECK.
          if psql -h 127.0.0.1 -U postgres -d ficusin_ci -v ON_ERROR_STOP=1 -c \
            "INSERT INTO order_items(order_id, product_name, unit_price, quantity) SELECT id, 'invalid new row', 1, 1 FROM orders WHERE order_number='CI-ORPHAN-ORDER'"; then
            echo 'order_items_catalog_identity_check accepted a new row without PRODUCT/SKU.' >&2
            exit 1
          fi

  saby-sync-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ficusin_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ficusin_runtime"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ficusin-ci:verify
      - name: Verify runtime tools
        run: |
          docker run --rm --entrypoint pdftotext ficusin-ci:verify -v
          docker run --rm --entrypoint wget ficusin-ci:verify --help >/dev/null
      - name: Boot production image and prove the storefront query survives
        run: |
          set -euo pipefail
          docker run -d \
            --name ficusin-runtime \
            --network host \
            -e DATABASE_URL='postgres://postgres:postgres@127.0.0.1:5432/ficusin_runtime?sslmode=disable' \
            -e DATABASE_SSL_VERIFY=false \
            -e TELEGRAM_BOT_TOKEN=ci-dummy-token \
            -e TELEGRAM_ORDER_CHAT_ID=-100000000001 \
            -e AUTH_COOKIE_SECURE=false \
            ficusin-ci:verify

          cleanup() {
            echo '::group::container logs'
            docker logs ficusin-runtime 2>&1 || true
            echo '::endgroup::'
            docker rm -f ficusin-runtime >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # The image carries no Docker HEALTHCHECK on purpose: Timeweb blocks
          # the release on that gate and it never opened. Readiness is asserted
          # the way Timeweb and a customer assert it - over HTTP, from outside
          # the container. A bound port is not enough: while migrations run the
          # endpoint answers {"status":"starting"}, and only the fully wired
          # router answers {"status":"ok"}.
          ready=0
          for attempt in $(seq 1 60); do
            state="$(docker inspect -f '{{.State.Status}}' ficusin-runtime)"
            health="$(curl -fsS --max-time 5 http://127.0.0.1:3000/api/v1/health || true)"
            echo "attempt=${attempt} state=${state} health=${health}"
            if [[ "$health" == *'"status":"ok"'* ]]; then
              ready=1
              break
            fi
            if [[ "$state" == "exited" || "$state" == "dead" ]]; then
              echo 'Production container exited before serving a ready health response.' >&2
              exit 1
            fi
            sleep 5
          done

          if [[ "$ready" != "1" ]]; then
            echo 'Production container did not serve a ready health response in time.' >&2
            exit 1
          fi

          # A ready health response says nothing about the storefront. The
          # catalogue query is the one that touches every table the catalogue
          # migrations rewrote, and on 22.08 it answered 503 in production while
          # health stayed ok and the admin panel worked. Nothing in CI executed
          # it, so nothing caught it. Now something does.
          catalog_code="$(curl -s -o /tmp/catalog.json -w '%{http_code}' --max-time 30 http://127.0.0.1:3000/api/v1/catalog)"
          echo "catalog_http=${catalog_code}"
          head -c 400 /tmp/catalog.json || true
          echo
          if [[ "$catalog_code" != "200" ]]; then
            echo 'The catalogue query fails against a fully migrated database.' >&2
            exit 1
          fi
