name: Verify

# Раньше стояло просто "push" и "pull_request" без условий: каждый коммит в
# ветку запускал сборку дважды, и половина минут уходила на дубликаты. Ветки
# проверяются через pull request, main — при вливании.
on:
  push:
    branches: [main]
  pull_request:

# Пока правишь замечания, коммиты идут один за другим. Старые прогоны больше
# не досиживают до конца впустую — новый отменяет предыдущий.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Guards the phone layout: it broke once without anyone noticing, because
  # nothing here ever looked at the site at a phone's width.
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm install
        working-directory: e2e
      # Браузеры весят сотни мегабайт и раньше качались заново каждый раз —
      # однажды это растянулось на двадцать шесть минут. Теперь они лежат в
      # кэше, а с нуля ставятся только когда меняется сам Playwright.
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}
      - run: npx playwright install --with-deps chromium webkit
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: e2e
      # Системные библиотеки в кэш не попадают, их всё равно нужно доставить.
      - run: npx playwright install-deps chromium webkit
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/api

  saby-sync-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  # Dockerfile — часть production-кода. Если он не собирается, зелёные Go и
  # frontend тесты не помогают: Timeweb всё равно не сможет выкатить релиз.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
