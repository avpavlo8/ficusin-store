name: Update procurement acceptance assertion
on:
  push:
    branches: [fix/procurement-reconciliation-workflow]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/procurement-reconciliation-workflow
      - name: Patch stale acceptance expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('e2e/verify-crm-acceptance.mjs')
          text = path.read_text()
          old = "await expect(invoiceDialog.getByText('Добавлено поставщиком',{exact:true})).toBeVisible();"
          new = "await expect(invoiceDialog.getByText(/Несопоставленные строки инвойса:/)).toBeVisible();await expect(invoiceDialog.getByRole('button',{name:'Это новая позиция',exact:true})).toBeVisible();"
          if old not in text:
              raise SystemExit('stale procurement acceptance assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add e2e/verify-crm-acceptance.mjs
          git commit -m "test(procurement): expect pending invoice review pool"
          git push origin HEAD:fix/procurement-reconciliation-workflow
