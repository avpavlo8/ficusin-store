name: Apply procurement match fix
on:
  push:
    branches: [fix/procurement-match-saby-without-store-card]
    paths: [.github/workflows/oneoff-apply-procurement-match-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/procurement-match-saby-without-store-card
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/internal/procurement/postgres_catalogue.go')
          s=p.read_text()
          old='''\tif input.MatchStatus == "confirmed" {\n\t\tif err := tx.QueryRow(ctx, `SELECT variant_id FROM canonical_product_directory\n\t\t\tWHERE active AND saby_id=$1 ORDER BY variant_id LIMIT 1`, input.SabyID).Scan(&canonicalVariantID); err != nil && !errors.Is(err, pgx.ErrNoRows) {\n\t\t\treturn AliasReview{}, fmt.Errorf("validate Saby nomenclature candidate: %w", err)\n\t\t}\n\t\tif canonicalVariantID == 0 {\n\t\t\treturn AliasReview{}, ErrNotFound\n\t\t}\n\t}\n'''
          new='''\tif input.MatchStatus == "confirmed" {\n\t\tvar candidateExists bool\n\t\tif err := tx.QueryRow(ctx, `SELECT EXISTS(SELECT 1 FROM saby_nomenclature WHERE saby_id=$1 AND missing_since IS NULL)`, input.SabyID).Scan(&candidateExists); err != nil {\n\t\t\treturn AliasReview{}, fmt.Errorf("validate Saby nomenclature candidate: %w", err)\n\t\t}\n\t\tif !candidateExists {\n\t\t\treturn AliasReview{}, ErrNotFound\n\t\t}\n\t\tif err := tx.QueryRow(ctx, `SELECT variant_id FROM canonical_product_directory\n\t\t\tWHERE active AND saby_id=$1 ORDER BY variant_id LIMIT 1`, input.SabyID).Scan(&canonicalVariantID); err != nil && !errors.Is(err, pgx.ErrNoRows) {\n\t\t\treturn AliasReview{}, fmt.Errorf("resolve canonical Saby candidate: %w", err)\n\t\t}\n\t}\n'''
          if old not in s: raise SystemExit('validation anchor missing')
          s=s.replace(old,new,1)
          s=s.replace("canonical_variant_id = CASE WHEN $3='confirmed' THEN $5 ELSE NULL END,","canonical_variant_id = CASE WHEN $3='confirmed' THEN NULLIF($5,0) ELSE NULL END,",1)
          s=s.replace("canonical_variant_id = CASE WHEN $3='confirmed' THEN $4 ELSE NULL END,","canonical_variant_id = CASE WHEN $3='confirmed' THEN NULLIF($4,0) ELSE NULL END,",1)
          old='''\t\t\tINSERT INTO procurement_supplier_products (supplier_id, saby_id, supplier_article, availability_status, updated_by)\n\t\t\tSELECT supplier_id, $2, supplier_article, availability_status, $3\n'''
          new='''\t\t\tINSERT INTO procurement_supplier_products (supplier_id, saby_id, canonical_variant_id, supplier_article, availability_status, updated_by)\n\t\t\tSELECT supplier_id, $2, NULLIF($4,0), supplier_article, availability_status, NULLIF($3,0)\n'''
          if old not in s: raise SystemExit('upsert anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('''\t\t`, aliasID, input.SabyID, actor.CustomerID); err != nil {\n\t\t\treturn AliasReview{}, fmt.Errorf("upsert procurement supplier product: %w", err)''','''\t\t`, aliasID, input.SabyID, actor.CustomerID, canonicalVariantID); err != nil {\n\t\t\treturn AliasReview{}, fmt.Errorf("upsert procurement supplier product: %w", err)''',1)
          p.write_text(s)
          f=Path('frontend/src/AdminProcurementDialogs.tsx')
          t=f.read_text()
          if '<article key={item.variantId}>' not in t: raise SystemExit('candidate key anchor missing')
          f.write_text(t.replace('<article key={item.variantId}>','<article key={item.sabyId}>',1))
          PY
          gofmt -w backend/internal/procurement/postgres_catalogue.go
          git diff --check
      - name: Test
        working-directory: backend
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/api
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/oneoff-apply-procurement-match-fix.yml .github/workflows/oneoff-fix-procurement-match-raw-saby.yml
          git add backend/internal/procurement/postgres_catalogue.go frontend/src/AdminProcurementDialogs.tsx
          git commit -m 'fix(procurement): match Saby-only catalogue items'
          git push origin HEAD:fix/procurement-match-saby-without-store-card
