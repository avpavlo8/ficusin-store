name: Check CDEK API access

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cdek-secret-check.yml"

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CDEK_CLIENT_ID: ${{ secrets.CDEK_CLIENT_ID }}
      CDEK_CLIENT_SECRET: ${{ secrets.CDEK_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check CDEK access without exposing credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          context = "cdek/credentials-missing"
          state = "failure"
          client_id = os.environ.get("CDEK_CLIENT_ID", "").strip()
          client_secret = os.environ.get("CDEK_CLIENT_SECRET", "").strip()
          if client_id and client_secret:
              try:
                  token_request = urllib.request.Request(
                      "https://api.cdek.ru/v2/oauth/token",
                      data=urllib.parse.urlencode({
                          "grant_type": "client_credentials",
                          "client_id": client_id,
                          "client_secret": client_secret,
                      }).encode("utf-8"),
                      headers={
                          "Content-Type": "application/x-www-form-urlencoded",
                          "User-Agent": "Ficusin-CDEK/1.0",
                      },
                      method="POST",
                  )
                  with urllib.request.urlopen(token_request, timeout=30) as response:
                      token = json.load(response).get("access_token")
                  if not token:
                      raise RuntimeError("missing token")
                  params = urllib.parse.urlencode({
                      "city": "Рязань",
                      "country_codes": "RU",
                      "size": 20,
                  })
                  city_request = urllib.request.Request(
                      "https://api.cdek.ru/v2/location/cities?" + params,
                      headers={
                          "Authorization": "Bearer " + token,
                          "Accept": "application/json",
                          "User-Agent": "Ficusin-CDEK/1.0",
                      },
                  )
                  with urllib.request.urlopen(city_request, timeout=30) as response:
                      cities = json.load(response)
                  exact = next(
                      (
                          city for city in cities
                          if str(city.get("city", "")).casefold() == "рязань"
                          and str(city.get("country_code", "RU")) == "RU"
                      ),
                      None,
                  )
                  if not exact or not exact.get("code"):
                      context = "cdek/auth-ok-city-not-found"
                  else:
                      context = "cdek/auth-ok-city-" + str(exact["code"])
                      state = "success"
              except Exception:
                  context = "cdek/auth-rejected"

          status_request = urllib.request.Request(
              "https://api.github.com/repos/"
              + os.environ["GITHUB_REPOSITORY"]
              + "/statuses/"
              + os.environ["GITHUB_SHA"],
              data=json.dumps({
                  "state": state,
                  "description": "CDEK API configuration check",
                  "context": context,
              }).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(status_request, timeout=20):
              pass
          if state != "success":
              raise SystemExit("CDEK API configuration is unavailable")
          PY
