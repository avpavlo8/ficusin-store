name: Verify unique-safe late alias collapse

on:
  push:
    branches:
      - fix/procurement-late-alias-collapse

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ficusin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ficusin_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ficusin_test?sslmode=disable
      CRM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ficusin_test?sslmode=disable
      DATABASE_SSL_VERIFY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/procurement-late-alias-collapse
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - name: Apply patch
        run: |
          python3 scripts/oneoff_fix_late_alias.py
          python3 scripts/oneoff_fix_late_alias_unique.py
          gofmt -w backend/internal/procurement/postgres_catalogue.go backend/internal/procurement/late_alias_reconciliation_live_test.go
      - name: Apply migrations transactionally
        run: |
          for file in $(find timeweb/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$file" >/dev/null
          done
      - name: Test backend
        working-directory: backend
        run: |
          go test ./internal/procurement -run TestResolveAliasCollapsesLateInvoiceLineOnLiveDatabase -count=1
          go test ./...
          go vet ./...
          go build ./cmd/api
      - name: Commit fix
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          rm -f .github/workflows/oneoff-late-alias-reconcile.yml
          rm -f .github/workflows/oneoff-late-alias-reconcile-v2.yml
          rm -f .github/workflows/oneoff-late-alias-reconcile-v3.yml
          rm -f .github/workflows/oneoff-late-alias-reconcile-v4.yml
          rm -f scripts/oneoff_fix_late_alias.py
          rm -f scripts/oneoff_fix_late_alias_unique.py
          git add -A
          git commit -m "fix(procurement): collapse late-matched invoice lines"
          git push origin HEAD:fix/procurement-late-alias-collapse
