name: Production smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/production-smoke.yml
  workflow_dispatch:

# Technical trigger: diagnose current production API only.
concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose current production API
        shell: bash
        run: |
          set -u
          for endpoint in /api/v1/health /api/v1/catalog /api/v1/categories /api/v1/collections; do
            echo "===== ${endpoint} ====="
            curl -sS --max-time 15 -D /tmp/headers -o /tmp/body "https://ficusin.ru${endpoint}?diagnostic=${GITHUB_SHA}" || true
            head -n 1 /tmp/headers || true
            grep -i '^content-type:' /tmp/headers || true
            head -c 12000 /tmp/body || true
            echo
          done
