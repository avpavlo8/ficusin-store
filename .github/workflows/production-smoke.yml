name: Production smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/production-smoke.yml
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show current production responses
        shell: bash
        run: |
          health="$(curl -fsS --max-time 10 https://ficusin.ru/api/v1/health || true)"
          release="$(curl -fsS --max-time 10 https://ficusin.ru/release.txt || true)"
          adjustment_status="$(curl -sS --max-time 10 -o /tmp/adjustment -w '%{http_code}' https://ficusin.ru/api/v1/admin/orders/1/adjustment || true)"
          adjustment_body="$(cat /tmp/adjustment 2>/dev/null || true)"
          html="$(curl -fsS --max-time 10 https://ficusin.ru/admin || true)"
          asset="$(printf '%s' "$html" | grep -oE 'src="/assets/[^"]+\.js"' | head -1 | cut -d'"' -f2 || true)"
          editor_bundle=no
          if [[ -n "$asset" ]]; then
            curl -fsS --max-time 20 "https://ficusin.ru${asset}" -o /tmp/app.js || true
            if grep -Fq 'Состав заказа' /tmp/app.js 2>/dev/null && grep -Fq 'Добавить товар' /tmp/app.js 2>/dev/null; then
              editor_bundle=yes
            fi
          fi
          echo "health=${health}"
          echo "release=${release}"
          echo "adjustment_status=${adjustment_status}"
          echo "adjustment_body=${adjustment_body}"
          echo "asset=${asset}"
          echo "editor_bundle=${editor_bundle}"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Timeweb and verify deployed frontend
        shell: bash
        run: |
          set -euo pipefail
          marker='ficusin-store orders-editor release 2026-08-20 18:51 MSK'
          for attempt in $(seq 1 30); do
            health="$(curl -fsS --max-time 10 https://ficusin.ru/api/v1/health || true)"
            release="$(curl -fsS --max-time 10 https://ficusin.ru/release.txt || true)"
            echo "attempt=${attempt} health=${health}"
            if [[ "$health" == *'"status":"ok"'* && "$release" == *"$marker"* ]]; then
              echo 'Production serves the frontend that includes PR #162.'
              exit 0
            fi
            sleep 20
          done
          echo 'Timeweb did not expose the expected release marker in time.' >&2
          exit 1
