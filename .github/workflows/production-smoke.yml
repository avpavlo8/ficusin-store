name: Production smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/production-smoke.yml
  workflow_dispatch:

concurrency:
  # A PR smoke must never cancel the real main production verification.
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build expected frontend from the production Docker stage
        run: |
          rm -rf frontend/dist
          docker buildx build --target frontend-dist --output type=local,dest=frontend/dist .
      - name: Wait for Timeweb and verify production
        shell: bash
        run: |
          set -euo pipefail

          expected_js="$(grep -oE 'src="/assets/[^"]+\.js"' frontend/dist/index.html | head -1 | cut -d'"' -f2)"
          expected_css="$(grep -oE 'href="/assets/[^"]+\.css"' frontend/dist/index.html | head -1 | cut -d'"' -f2)"

          if [[ -z "$expected_js" || -z "$expected_css" ]]; then
            echo 'Could not determine expected frontend assets.' >&2
            exit 1
          fi

          echo "expected_js=${expected_js}"
          echo "expected_css=${expected_css}"

          for attempt in $(seq 1 36); do
            health="$(curl -fsS --max-time 10 "https://ficusin.ru/api/v1/health?deploy=${GITHUB_SHA}" || true)"
            html="$(curl -fsS --max-time 15 "https://ficusin.ru/admin?deploy=${GITHUB_SHA}&attempt=${attempt}" || true)"
            actual_js="$(printf '%s' "$html" | grep -oE 'src="/assets/[^"]+\.js"' | head -1 | cut -d'"' -f2 || true)"
            actual_css="$(printf '%s' "$html" | grep -oE 'href="/assets/[^"]+\.css"' | head -1 | cut -d'"' -f2 || true)"
            catalog_count="$(curl -fsS --max-time 20 "https://ficusin.ru/api/v1/catalog?deploy=${GITHUB_SHA}&attempt=${attempt}" \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); products=data.get("products"); print(len(products) if isinstance(products, list) else 0)' \
              2>/dev/null || printf '0')"

            echo "attempt=${attempt} health=${health} js=${actual_js} css=${actual_css} catalog_products=${catalog_count}"

            if [[ "$health" == *'"status":"ok"'* \
              && "$actual_js" == "$expected_js" \
              && "$actual_css" == "$expected_css" \
              && "$catalog_count" =~ ^[0-9]+$ \
              && "$catalog_count" -gt 0 ]]; then
              echo "Production is healthy, serves the exact frontend bundle and a non-empty catalog for ${GITHUB_SHA}."
              exit 0
            fi
            sleep 20
          done

          echo 'Timeweb did not expose a healthy exact production release with a non-empty catalog in time.' >&2
          exit 1

      - name: Wait for imported draft enrichment to finish
        run: |
          set -euo pipefail
          for attempt in $(seq 1 660); do
            raw="$(curl -fsS --max-time 15 "https://ficusin.ru/api/v1/catalog-enrichment/status?attempt=${attempt}" || true)"
            state="$(printf '%s' "$raw" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(f"{d.get(\"pending\",-1)}:{d.get(\"processing\",-1)}:{d.get(\"done\",-1)}:{d.get(\"failed\",-1)}")' 2>/dev/null || true)"
            echo "attempt=${attempt} queue=${state}"
            IFS=: read -r pending processing done failed <<<"$state"
            if [[ "$pending" == "0" && "$processing" == "0" && "$failed" == "0" && "$done" =~ ^[1-9][0-9]*$ ]]; then
              echo "All imported drafts have generated content and covers: ${done}."
              exit 0
            fi
            if [[ "$failed" =~ ^[1-9][0-9]*$ ]]; then
              echo "Catalog enrichment has ${failed} exhausted jobs." >&2
              exit 1
            fi
            sleep 30
          done
          echo 'Catalog enrichment did not finish within the diagnostic window.' >&2
          exit 1
