name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS deployment to verify (production or a Timeweb staging app)
        required: true
        default: https://ficusin.ru
        type: string

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'staging-verification' }}
      url: ${{ github.event_name == 'push' && 'https://ficusin.ru' || inputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment target
        id: target
        env:
          REQUESTED_BASE_URL: ${{ github.event_name == 'push' && 'https://ficusin.ru' || inputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import os
          from urllib.parse import urlsplit

          raw = os.environ["REQUESTED_BASE_URL"].strip().rstrip("/")
          target = urlsplit(raw)
          host = (target.hostname or "").lower()
          allowed = host in {"ficusin.ru", "www.ficusin.ru"} or host.endswith(".twc1.net")
          if target.scheme != "https" or not allowed or target.username or target.password or target.port:
              raise SystemExit("base_url must be an HTTPS Ficusin or Timeweb application without credentials or a custom port")
          if target.path or target.query or target.fragment:
              raise SystemExit("base_url must contain only scheme and host")
          print(f"base_url={raw}")
          PY
      - uses: docker/setup-buildx-action@v3
      - name: Build expected frontend from the production Docker stage
        run: |
          rm -rf frontend/dist
          docker buildx build --target frontend-dist --output type=local,dest=frontend/dist .
      - name: Wait for Timeweb and verify production
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail

          expected_js="$(grep -oE 'src="/assets/[^"]+\.js"' frontend/dist/index.html | head -1 | cut -d'"' -f2)"
          expected_css="$(grep -oE 'href="/assets/[^"]+\.css"' frontend/dist/index.html | head -1 | cut -d'"' -f2)"
          expected_backend="$(
            {
              find backend -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) -print0 | sort -z | xargs -0 sha256sum | cut -d' ' -f1
              sha256sum frontend/dist/index.html | cut -d' ' -f1
            } | sha256sum | cut -c1-16
          )"

          if [[ -z "$expected_js" || -z "$expected_css" ]]; then
            echo 'Could not determine expected frontend assets.' >&2
            exit 1
          fi

          echo "expected_backend=${expected_backend}"
          echo "expected_js=${expected_js}"
          echo "expected_css=${expected_css}"

          deadline=$((SECONDS + 1200))
          for attempt in $(seq 1 72); do
            health="$(curl -fsS --max-time 10 "${BASE_URL}/api/v1/health?deploy=${GITHUB_SHA}" || true)"
            readiness="$(curl -fsS --max-time 10 "${BASE_URL}/api/v1/ready?deploy=${GITHUB_SHA}" || true)"
            actual_backend="$(printf '%s' "$health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)"
            html="$(curl -fsS --max-time 15 "${BASE_URL}/admin?deploy=${GITHUB_SHA}&attempt=${attempt}" || true)"
            actual_js="$(printf '%s' "$html" | grep -oE 'src="/assets/[^"]+\.js"' | head -1 | cut -d'"' -f2 || true)"
            actual_css="$(printf '%s' "$html" | grep -oE 'href="/assets/[^"]+\.css"' | head -1 | cut -d'"' -f2 || true)"
            catalog_count="$(curl -fsS --max-time 20 "${BASE_URL}/api/v1/catalog?deploy=${GITHUB_SHA}&attempt=${attempt}" \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); products=data.get("products"); print(len(products) if isinstance(products, list) else 0)' \
              2>/dev/null || printf '0')"

            echo "attempt=${attempt} health=${health} readiness=${readiness} backend=${actual_backend} js=${actual_js} css=${actual_css} catalog_products=${catalog_count}"

            if [[ "$health" == *'"status":"ok"'* \
              && "$readiness" == *'"status":"ok"'* \
              && "$actual_backend" == "$expected_backend" \
              && "$actual_js" == "$expected_js" \
              && "$actual_css" == "$expected_css" \
              && "$catalog_count" =~ ^[0-9]+$ \
              && "$catalog_count" -gt 0 ]]; then
              echo "Production is healthy, serves the exact frontend bundle and a non-empty catalog for ${GITHUB_SHA}."
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              break
            fi
            sleep 20
          done

          echo 'Timeweb did not expose a healthy exact production release with a non-empty catalog in time.' >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium webkit
        working-directory: e2e
      - name: Verify real production in desktop and mobile browsers
        env:
          FICUSIN_BASE_URL: ${{ steps.target.outputs.base_url }}
        run: npx playwright test --config playwright.production.config.ts
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-playwright-report
          path: e2e/playwright-report
          retention-days: 30
      - name: Open or update a failed release incident
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title='[Sev-1] Production release verification failed'
          issue="$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "[Sev-1] Production release verification failed") | .number' | head -1)"
          body="$(printf '%s\n\n%s\n%s\n%s' \
            'Production did not verify the exact main revision or failed browser commerce reads.' \
            "Run: ${RUN_URL}" "Commit: ${GITHUB_SHA}" "Detected: $(date -u +%FT%TZ)")"
          if [[ -n "$issue" ]]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
      - name: Close the release incident after recovery
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          issue="$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "[Sev-1] Production release verification failed") | .number' | head -1)"
          if [[ -n "$issue" ]]; then gh issue close "$issue" --comment "Exact release and browser checks recovered. ${RUN_URL}"; fi
