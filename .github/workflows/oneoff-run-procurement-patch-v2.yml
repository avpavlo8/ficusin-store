name: Run procurement patch v2
on:
  push:
    branches: [fix/procurement-invoice-swap-receiving-pdf]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/procurement-invoice-swap-receiving-pdf
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply and verify patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/oneoff-procurement-swap-pdf.yml').read_text()
          start = source.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          script = script.split('          # Runtime font for Cyrillic PDF output.')[0]
          script = script.split('# Runtime font for Cyrillic PDF output.')[0]
          Path('/tmp/procurement_patch.py').write_text(script)
          PY
          python3 /tmp/procurement_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Dockerfile')
          text = path.read_text()
          text = text.replace('FROM golang:1.26-bookworm@sha256:6ef6e30f0ea5c384f6d111cf856e024e3086bbdcb1779da3f3bfbba0aea53d2 AS backend\n', 'FROM golang:1.26-bookworm@sha256:6ef6e30f0ea5c384f6d111cf856e024e3086bbdcb1779da3f3bfbba0aea53d2 AS backend\nRUN apt-get update && apt-get install -y --no-install-recommends fonts-dejavu-core && rm -rf /var/lib/apt/lists/*\n', 1)
          text = text.replace('COPY --from=backend /out/ficusin-api /app/ficusin-api\n', 'COPY --from=backend /out/ficusin-api /app/ficusin-api\nCOPY --from=backend /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf /app/fonts/DejaVuSans.ttf\n', 1)
          text = text.replace('ENV MIGRATIONS_DIR=/app/migrations\n', 'ENV MIGRATIONS_DIR=/app/migrations\nENV PROCUREMENT_PDF_FONT=/app/fonts/DejaVuSans.ttf\n', 1)
          path.write_text(text)
          PY
          cd backend
          go get github.com/signintech/gopdf@latest
          go mod tidy
          gofmt -w internal/procurement/postgres_catalogue.go internal/procurement/service.go internal/procurement/receiving_pdf.go internal/procurement/receiving_pdf_test.go internal/procurement/late_alias_reconciliation_live_test.go internal/httpapi/procurement.go internal/httpapi/procurement_test.go internal/httpapi/crm_permissions_test.go internal/httpapi/router.go
          go test ./...
          go vet ./...
          go build ./cmd/api
          cd ../frontend
          npm ci
          npm run lint
          npm run build
          cd ..
      - name: Commit patch
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add Dockerfile backend frontend/src/AdminProcurementDialogs.tsx
          git commit -m "feat(procurement): swap invoice rows and add receiving PDF"
          git push origin HEAD:fix/procurement-invoice-swap-receiving-pdf
