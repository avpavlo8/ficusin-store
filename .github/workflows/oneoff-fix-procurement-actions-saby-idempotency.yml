name: Apply procurement action reliability fixes
on:
  push:
    branches:
      - fix/procurement-actions-saby-idempotency
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/procurement-actions-saby-idempotency
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Patch procurement actions
        run: python3 scripts/oneoff_fix_procurement_actions.py
      - name: Format Go
        run: gofmt -w backend/internal/procurement/saby_price_xlsx.go backend/internal/procurement/saby_price_xlsx_test.go backend/internal/procurement/service.go backend/internal/procurement/service_test.go backend/internal/procurement/postgres_actions.go backend/internal/integration/saby_procurement.go backend/internal/integration/saby_procurement_test.go
      - name: Verify backend
        working-directory: backend
        run: |
          go test ./internal/procurement ./internal/integration ./internal/saby
          go vet ./...
          go build ./cmd/api
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit fix
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add backend frontend
          git commit -m 'fix(procurement): make receipt and price actions safe'
          git push origin HEAD:fix/procurement-actions-saby-idempotency
