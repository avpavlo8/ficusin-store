name: Apply Saby sync feedback fix
on:
  push:
    branches:
      - fix/saby-sync-feedback
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saby-sync-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/oneoff_fix_saby_sync_feedback.py
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit fix
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add frontend/src/AdminProcurement.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(procurement): show Saby catalogue sync progress"
          git push origin HEAD:fix/saby-sync-feedback
