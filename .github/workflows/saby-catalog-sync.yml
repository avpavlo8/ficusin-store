name: Sync Saby catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/saby-catalog-sync.yml"

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: saby-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SABY_APP_CLIENT_ID: ${{ secrets.SABY_APP_CLIENT_ID }}
      SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
      SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
      SABY_POINT_ID: "278"
      SABY_PRICE_LIST_ID: "6"
      FICUSIN_SYNC_URL: "https://ryazan-plants.avpavlomail.chatgpt.site/api/integrations/saby/catalog"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Send current Saby catalog to the store
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          stage = "settings"

          def request_json(request):
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def report(context, state):
              request = urllib.request.Request(
                  "https://api.github.com/repos/"
                  + os.environ["GITHUB_REPOSITORY"]
                  + "/statuses/"
                  + os.environ["GITHUB_SHA"],
                  data=json.dumps({
                      "state": state,
                      "description": (
                          "Saby catalog delivered to the store"
                          if state == "success"
                          else "Saby catalog sync failed"
                      ),
                      "context": context[:100],
                  }).encode("utf-8"),
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30):
                  pass

          try:
              required = (
                  "SABY_APP_CLIENT_ID",
                  "SABY_APP_SECRET",
                  "SABY_SECRET_KEY",
                  "ACTIONS_ID_TOKEN_REQUEST_URL",
                  "ACTIONS_ID_TOKEN_REQUEST_TOKEN",
              )
              if any(not os.environ.get(name) for name in required):
                  raise RuntimeError("missing settings")

              stage = "saby-auth"
              auth_request = urllib.request.Request(
                  "https://online.sbis.ru/oauth/service/",
                  data=json.dumps({
                      "app_client_id": os.environ["SABY_APP_CLIENT_ID"],
                      "app_secret": os.environ["SABY_APP_SECRET"],
                      "secret_key": os.environ["SABY_SECRET_KEY"],
                  }).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              saby_token = request_json(auth_request).get("token")
              if not saby_token:
                  raise RuntimeError("no Saby token")

              stage = "saby-catalog"
              catalog_items = []
              for page in range(20):
                  params = urllib.parse.urlencode({
                      "pointId": os.environ["SABY_POINT_ID"],
                      "priceListId": os.environ["SABY_PRICE_LIST_ID"],
                      "withBalance": "true",
                      "withBarcode": "true",
                      "noStopList": "true",
                      "pageSize": 1000,
                      "page": page,
                  })
                  request = urllib.request.Request(
                      "https://api.sbis.ru/retail/v2/nomenclature/list?" + params,
                      headers={"X-SBISAccessToken": saby_token},
                  )
                  result = request_json(request)
                  items = (
                      result.get("nomenclatures")
                      or result.get("items")
                      or result.get("result")
                      or []
                  )
                  catalog_items.extend(items)
                  outcome = result.get("outcome")
                  has_more = (
                      outcome is True
                      or isinstance(outcome, dict) and bool(outcome.get("hasMore"))
                  )
                  if not items or not has_more:
                      break
              else:
                  raise RuntimeError("pagination limit")
              if not catalog_items:
                  raise RuntimeError("empty catalog")

              stage = "github-oidc"
              oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              separator = "&" if "?" in oidc_url else "?"
              oidc_request = urllib.request.Request(
                  oidc_url + separator + urllib.parse.urlencode({
                      "audience": "ficusin-store-saby-sync",
                  }),
                  headers={
                      "Authorization":
                          "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
                  },
              )
              oidc_token = request_json(oidc_request).get("value")
              if not oidc_token:
                  raise RuntimeError("no OIDC token")

              payload_part = oidc_token.split(".")[1]
              payload_part += "=" * (-len(payload_part) % 4)
              import base64
              claims = json.loads(
                  base64.urlsafe_b64decode(payload_part.encode("ascii"))
              )
              audience = claims.get("aud")
              audiences = audience if isinstance(audience, list) else [audience]
              flags = "".join([
                  "i1" if claims.get("iss") == "https://token.actions.githubusercontent.com" else "i0",
                  "a1" if "ficusin-store-saby-sync" in audiences else "a0",
                  "r1" if claims.get("repository") == "avpavlo8/ficusin-store" else "r0",
                  "f1" if claims.get("ref") == "refs/heads/main" else "f0",
                  "w1" if claims.get("workflow_ref") == "avpavlo8/ficusin-store/.github/workflows/saby-catalog-sync.yml@refs/heads/main" else "w0",
              ])
              report("saby/oidc-" + flags, "success")

              allowed_fields = (
                  "id",
                  "article",
                  "name",
                  "description",
                  "cost",
                  "balance",
                  "images",
                  "published",
                  "isParent",
              )
              public_catalog = [
                  {key: item.get(key) for key in allowed_fields if key in item}
                  for item in catalog_items
              ]

              stage = "store"
              sync_request = urllib.request.Request(
                  os.environ["FICUSIN_SYNC_URL"],
                  data=json.dumps(
                      {"items": public_catalog},
                      ensure_ascii=False,
                  ).encode("utf-8"),
                  headers={
                      "Authorization": "Bearer " + oidc_token,
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              response = request_json(sync_request)
              if not response.get("ok"):
                  raise RuntimeError("store rejected catalog")

              report(f"saby/store-sync/success-r{len(public_catalog)}", "success")
              print("Saby catalog sync completed")
          except urllib.error.HTTPError as error:
              report(f"saby/store-sync/{stage}-http{error.code}", "failure")
              raise SystemExit(f"Sync failed at {stage}: HTTP {error.code}") from None
          except Exception:
              report(f"saby/store-sync/{stage}-error", "failure")
              raise SystemExit(f"Sync failed at {stage}") from None
          PY
