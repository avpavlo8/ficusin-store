name: Saby catalog sync

on:
  push:
    branches: [main]
    paths:
      - scripts/sync-saby.py
      - scripts/saby_catalog_merge.py
      - timeweb/migrations/*saby*.sql
      - .github/workflows/saby-catalog-sync.yml
  schedule:
    # Cached Saby prices and balances are the source for every site screen.
    # Refresh hourly; the admin button remains available for an immediate pull.
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  statuses: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Saby catalog
        env:
          SABY_APP_CLIENT_ID: ${{ secrets.SABY_APP_CLIENT_ID }}
          SABY_APP_SECRET: ${{ secrets.SABY_APP_SECRET }}
          SABY_SECRET_KEY: ${{ secrets.SABY_SECRET_KEY }}
          SABY_POINT_ID: ${{ vars.SABY_POINT_ID }}
          SABY_PRICE_LIST_ID: ${{ vars.SABY_PRICE_LIST_ID }}
          FICUSIN_SYNC_URL: ${{ vars.FICUSIN_SYNC_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync-saby.py
