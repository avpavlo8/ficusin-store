name: Timeweb token probe

on:
  pull_request:
    paths:
      - .github/workflows/timeweb-token-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
    steps:
      - name: Check deploy token presence
        shell: bash
        run: |
          if [[ -z "$TIMEWEB_CLOUD_TOKEN" ]]; then
            echo 'TIMEWEB_CLOUD_TOKEN is not configured.' >&2
            exit 1
          fi
          echo 'TIMEWEB_CLOUD_TOKEN is configured.'
