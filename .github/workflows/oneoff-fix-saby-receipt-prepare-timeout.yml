name: Apply Saby receipt timeout fix
on:
  push:
    branches:
      - fix/saby-receipt-prepare-timeout
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saby-receipt-prepare-timeout
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Patch synchronous Saby refresh out of HTTP path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('backend/internal/procurement/service.go')
          text = p.read_text()
          old = '''\tif kind == "receipt" && service.executor != nil && service.executor.Configured("saby") {\n\t\tif refresher, ok := service.executor.(SabyCatalogRefresher); ok {\n\t\t\tif _, err := refresher.RefreshSabyCatalog(ctx); err != nil {\n\t\t\t\treturn ActionBatch{}, &UserFacingError{Message: "Не удалось обновить актуальные остатки СБИС перед поступлением. Повторите подготовку поступления позже."}\n\t\t\t}\n\t\t}\n\t}\n'''
          new = '''\tif kind == "receipt" && service.executor != nil && service.executor.Configured("saby") {\n\t\t// Preparing a receipt is an HTTP request and must not synchronously export\n\t\t// the full Saby catalogue: production gateways time out before that\n\t\t// operation finishes. Queue the shared catalogue worker instead and take\n\t\t// the receipt snapshot from the local mirror. The worker refreshes balances\n\t\t// independently without blocking or duplicating the receipt action.\n\t\tif coordinator, ok := service.store.(IntegrationSyncCoordinator); ok {\n\t\t\tif _, err := coordinator.RequestIntegrationSync(ctx, "saby", "catalog"); err != nil {\n\t\t\t\treturn ActionBatch{}, fmt.Errorf("queue Saby catalogue refresh before receipt: %w", err)\n\t\t\t}\n\t\t}\n\t}\n'''
          if old not in text:
              raise SystemExit('service PrepareBatch block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('backend/internal/procurement/service_test.go')
          text = p.read_text()
          old = '''func TestPrepareReceiptRefreshesSabyBalancesBeforeSnapshot(t *testing.T) {\n\tt.Parallel()\n\tstore := &storeStub{}\n\texecutor := &sabyRefreshExecutorStub{}\n\tservice := NewServiceWithExecutor(store, executor)\n\tbatch, err := service.PrepareBatch(context.Background(), Actor{}, 18, "receipt", nil)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif batch.Kind != "receipt" || executor.refreshCalls != 1 {\n\t\tt.Fatalf("batch=%+v refreshCalls=%d", batch, executor.refreshCalls)\n\t}\n}\n'''
          new = '''func TestPrepareReceiptDoesNotSynchronouslyRefreshSaby(t *testing.T) {\n\tt.Parallel()\n\tstore := &storeStub{}\n\texecutor := &sabyRefreshExecutorStub{}\n\tservice := NewServiceWithExecutor(store, executor)\n\tbatch, err := service.PrepareBatch(context.Background(), Actor{}, 18, "receipt", nil)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif batch.Kind != "receipt" || executor.refreshCalls != 0 {\n\t\tt.Fatalf("batch=%+v refreshCalls=%d; HTTP preparation must not call Saby catalogue directly", batch, executor.refreshCalls)\n\t}\n}\n'''
          if old not in text:
              raise SystemExit('service test block not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Verify backend
        working-directory: backend
        run: |
          go test ./internal/procurement ./internal/integration
          go vet ./...
          go build ./cmd/api
      - name: Commit fix
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add backend/internal/procurement/service.go backend/internal/procurement/service_test.go
          git diff --cached --quiet && exit 0
          git commit -m "fix(procurement): avoid Saby refresh timeout during receipt preparation"
          git push origin HEAD:fix/saby-receipt-prepare-timeout
