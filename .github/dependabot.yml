version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-development:
        dependency-type: development
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      browser-tests:
        dependency-type: development
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
